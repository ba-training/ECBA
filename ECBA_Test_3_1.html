<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECBA Test 3.1</title>
<style>
:root{
  color-scheme: light dark;
  --bg:#f3f6fa; --surface:#ffffff; --ink:#1a2230; --muted:#5b6678; --line:#d9e0ea;
  --brand:#1d4f91; --brand-ink:#ffffff; --brand-soft:#e4edf8;
  --ok:#17703f; --ok-soft:#e1f4e8; --bad:#a82f26; --bad-soft:#fbe6e3; --skip:#7a5a00; --skip-soft:#fbf0d2;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#10151d; --surface:#1a212c; --ink:#e8edf4; --muted:#9aa6b8; --line:#2c3646;
    --brand:#7fb0ee; --brand-ink:#0d1a2b; --brand-soft:#203248;
    --ok:#6fd49a; --ok-soft:#173526; --bad:#ff9a90; --bad-soft:#3d1f1c; --skip:#f0cf72; --skip-soft:#38300f;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 120px}
header.top{background:var(--brand);color:var(--brand-ink);padding:28px 16px;text-align:center}
header.top h1{margin:0;font-size:clamp(1.4rem,4vw,2rem);line-height:1.2;letter-spacing:.2px}
header.top p{margin:6px 0 0;opacity:.85;font-size:.95rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;margin-top:20px}
.hidden{display:none!important}
label.field{display:block;font-weight:600;margin-bottom:8px}
input[type=text]{width:100%;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input[type=text]:focus-visible,button:focus-visible,.opt:has(input:focus-visible){outline:3px solid var(--brand);outline-offset:2px}
.err{color:var(--bad);margin:8px 0 0;min-height:1.4em;font-size:.92rem}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:12px 22px;background:var(--brand);color:var(--brand-ink);cursor:pointer}
button.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand)}
button:hover{filter:brightness(1.08)}
.who{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:.95rem;margin-top:20px}
.who strong{color:var(--ink)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;margin-top:16px;border-left-width:6px}
.q h2{margin:0 0 4px;font-size:.95rem;color:var(--muted);font-weight:600;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.q .text{margin:0 0 14px;font-size:1.05rem;font-weight:600}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--bg)}
.opt:hover{border-color:var(--brand)}
.opt input{margin-top:5px;accent-color:var(--brand)}
.opt .k{font-weight:700;min-width:1.3em}
.opt:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.locked .opt{cursor:default}
.locked .opt:hover{border-color:var(--line)}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt .tag{margin-left:auto;font-size:.85rem;font-weight:700;white-space:nowrap;padding-left:8px}
.opt.correct .tag{color:var(--ok)} .opt.wrong .tag{color:var(--bad)}
.q.r-ok{border-left-color:var(--ok)} .q.r-bad{border-left-color:var(--bad)} .q.r-skip{border-left-color:var(--skip)}
.badge{font-size:.85rem;font-weight:700;padding:2px 10px;border-radius:99px}
.r-ok .badge{background:var(--ok-soft);color:var(--ok)}
.r-bad .badge{background:var(--bad-soft);color:var(--bad)}
.r-skip .badge{background:var(--skip-soft);color:var(--skip)}
.explain{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.explain .ans{margin:0 0 8px;font-weight:700}
.explain p{margin:0 0 8px}
.explain ul{margin:6px 0 0;padding-left:20px;color:var(--muted)}
.explain li{margin-bottom:6px}
.domain{font-size:.85rem;color:var(--muted);margin-top:8px}
.result{border-width:2px;border-color:var(--brand)}
.result h2{margin:0 0 12px;font-size:1.25rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px}
.stat b{display:block;font-size:1.7rem;line-height:1.2}
.stat span{color:var(--muted);font-size:.9rem}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px}
.dock .in{max-width:820px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.dock .prog{color:var(--muted);font-size:.95rem}
.note{color:var(--muted);font-size:.92rem;margin:10px 0 0}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<header class="top">
  <h1 id="examTitle">ECBA Test 3.1</h1>
  <p id="examSub"></p>
</header>

<main class="wrap">
  <section id="start" class="card">
    <label class="field" for="name">Nhập họ và tên của bạn để bắt đầu làm bài</label>
    <input id="name" type="text" autocomplete="name" placeholder="Ví dụ: Nguyễn Văn A" maxlength="80">
    <p class="err" id="nameErr" role="alert"></p>
    <button id="startBtn" type="button">Bắt đầu làm bài</button>
    <p class="note">Bài gồm <span id="total1"></span> câu trắc nghiệm. Bạn có thể nộp bài bất cứ lúc nào; câu chưa trả lời sẽ tính là sai.</p>
  </section>

  <section id="quiz" class="hidden">
    <div class="who"><span>Thí sinh: <strong id="who"></strong></span><span id="whoNote"></span></div>
    <div id="result" class="card result hidden" tabindex="-1"></div>
    <form id="form" onsubmit="return false"><div id="list"></div></form>
  </section>
</main>

<div class="dock hidden" id="dock">
  <div class="in">
    <span class="prog" id="prog"></span>
    <button id="submitBtn" type="button">Nộp bài</button>
  </div>
</div>

<script>
const QUESTIONS = [{"q": "Who is responsible for discovering, synthesizing, and analyzing information within an enterprise?", "opts": ["Business analyst", "Project manager", "Project sponsor", "Programmer"], "key": "A", "expl": "Business analysts are responsible for discovering, synthesizing, and analyzing information within an enterprise to support the identification of business needs and requirements.", "dom": "Elicitation and Collaboration"}, {"q": "What tool can be used to determine the impact of a changed requirement on other requirements?", "opts": ["Interview", "Workshop", "Traceability", "Verification"], "key": "C", "expl": "Traceability is a tool used to determine the impact of a changed requirement on other requirements. It helps maintain a clear link between requirements, ensuring that changes are well understood.", "dom": "Stakeholder"}, {"q": "In the context of a new software development project, the requirement for user authentication cannot be implemented until the user interface design is complete. What does this scenario illustrate?", "opts": ["The relationship between requirements, where one requirement cannot be fulfilled unless another one is fulfilled.", "The financial dependency on stakeholders to implement requirements.", "The dependency on external factors such as weather, market conditions, or public sentiment.", "The dependency on the business analyst for prioritizing requirements."], "key": "A", "expl": "This scenario illustrates the concept of 'Dependencies' in the context of prioritizing requirements. It refers to the relationship between requirements, where one requirement cannot be fulfilled unless another one is fulfilled. In this case, the requirement for user authentication is dependent on the completion of the user interface design.Option 1: This option is incorrect because the scenario does not involve any financial dependency on stakeholders to implement requirements.Option 2: This option is incorrect because the scenario does not involve any dependency on external factors such as weather, market conditions, or public sentiment.Option 3: This option is incorrect because the scenario does not involve any dependency on the business analyst for prioritizing requirements. The dependency is between two different requirements.", "dom": "Requirements Analysis and Design Definition"}, {"q": "You are a business analyst working on a new software development project. The project has several requirements, and you need to prioritize them. Which of the following factors would most significantly influence your prioritization of these requirements?", "opts": ["The complexity of the requirement and how difficult it is to implement.", "The novelty of the requirement and how innovative it is.", "The popularity of the requirement among stakeholders and how many stakeholders are in favor of it.", "The likelihood that the requirement will change in the future."], "key": "D", "expl": "The most significant factor that influences the prioritization of requirements is the likelihood that the requirement will change in the future. This is because changes in requirements can lead to increased costs and delays in project delivery. Therefore, it is crucial to prioritize requirements that are less likely to change to ensure the project's success.Option 1: While the novelty of a requirement can be an interesting aspect, it is not the most significant factor in prioritizing requirements. A novel requirement might not necessarily add value to the project or meet the needs of the stakeholders.Option 2: The popularity of a requirement among stakeholders is important, but it is not the most significant factor. A requirement that is popular among stakeholders might not necessarily align with the project's objectives or provide the most value.Option 3: The complexity of a requirement is a factor to consider, but it is not the most significant factor in prioritizing requirements. A complex requirement might add value to the project, but if it is likely to change, it could lead to increased costs and delays.", "dom": "Requirements Analysis and Design Definition"}, {"q": "Your organization is planning to develop a new customer relationship management (CRM) system. As a business analyst, what should be your primary focus when developing design options for this new CRM system?", "opts": ["Envisioning the desired future state of the organization with the new CRM system", "Understanding the competitive landscape of the CRM market", "Analyzing the current CRM system and its functionalities", "Reviewing the past performance of the organization"], "key": "A", "expl": "When developing design options for a business, the primary focus of the analyst should be on the desired future state of the organization. In this case, the desired future state would be how the organization plans to operate with the new CRM system. This includes understanding the organization's future goals, the expected benefits from the new system, and how the new system will help achieve those goals. The analyst should consider the needs and expectations of the stakeholders, the capabilities that the new system should have, and the changes that will need to be made in the organization's processes and operations to accommodate the new system.Option 1: While analyzing the current CRM system and its functionalities is important, it should not be the primary focus. The primary focus should be on the desired future state of the organization.Option 2: Reviewing the past performance of the organization can provide useful insights, but it is not the primary focus when developing design options for a new system. The primary focus should be on the desired future state of the organization.Option 3: Understanding the competitive landscape of the CRM market can help in making informed decisions, but it is not the primary focus when developing design options. The primary focus should be on the desired future state of the organization.", "dom": "Requirements Analysis and Design Definition"}, {"q": "Who are the main stakeholders involved in the task of verifying requirements?", "opts": ["The business analyst and the domain and implementation subject matter experts", "The business analyst only", "All stakeholders", "The project management team"], "key": "C", "expl": "While the business analyst, in conjunction with the domain and implementation subject matter experts, has the primary responsibility for determining that the task of verifying requirements has been completed, BABOK® v3 suggests that all stakeholders could be involved in this task, as they may discover problematic requirements during requirements communication.BABOK v3 Chapter 7.2.7", "dom": "Stakeholder"}, {"q": "If inconsistencies arise between different elicitation results, the business analyst (BA) should:", "opts": ["reconcile them through experience.", "report them to the project manager.", "resolve them through collaboration.", "escalate them to the business sponsor."], "key": "C", "expl": "When inconsistencies arise between different elicitation results, the business analyst should work collaboratively with stakeholders to resolve these inconsistencies and ensure a consistent set of requirements.", "dom": "Understanding Business Analysis"}, {"q": "As a business analyst, you are working on a project that requires a significant change in the current business process. Some stakeholders are resistant to this change. According to BABOKÂ® v3, how should you manage your relationship with these stakeholders?", "opts": ["Try to persuade resistant stakeholders by highlighting the benefits of the change", "Exclude resistant stakeholders from the decisionmaking process", "Avoid any interaction with stakeholders who resist change", "Engage with resistant stakeholders to understand their concerns and work towards a mutually beneficial solution"], "key": "D", "expl": "According to BABOKÂ® v3, business analysts actively manage relationships with all stakeholders, including those who resist change. This is achieved by engaging with them to understand their concerns and working towards a solution that addresses these concerns while still delivering value to the business. Avoiding interaction or excluding them from the decisionmaking process is not an effective way to manage relationships with stakeholders.Option 1: Avoiding interaction with stakeholders who resist change is not an effective way to manage relationships. It is important to engage with all stakeholders, understand their concerns and work towards a mutually beneficial solution.Option 2: While highlighting the benefits of the change can be part of the communication strategy, it is not the only way to manage relationships with resistant stakeholders. It is also important to understand their concerns and work towards a solution that addresses these concerns.Option 3: Excluding resistant stakeholders from the decisionmaking process is not an effective way to manage relationships. All stakeholders, including those who resist change, should be involved in the decisionmaking process.", "dom": "Elicitation and Collaboration"}, {"q": "In the context of a new project, the business analyst is developing a business analysis information package. What should be the primary goal of this package?", "opts": ["To obtain formal reviews and approvals", "To assess the conformance to contractual and regulatory obligations", "To maintain the information for reuse purposes", "To convey information clearly and in a usable format for continuing change activities"], "key": "D", "expl": "The primary goal of developing a business analysis information package is to convey information clearly and in a usable format for continuing change activities. This is because it is crucial for the stakeholders to understand the information for making informed decisions and for the seamless execution of the project. The package should be designed in a way that it facilitates the understanding of the business analysis work, the results, and the value it provides.Option 1: While maintaining the information for reuse purposes is an important aspect, it is not the primary goal of a business analysis information package. The main aim is to effectively communicate the information.Option 2: Obtaining formal reviews and approvals is a part of the process, but it is not the primary goal of the business analysis information package.Option 3: Assessing the conformance to contractual and regulatory obligations is important but it is not the primary goal of the business analysis information package.", "dom": "Requirements Analysis and Design Definition"}, {"q": "Which criteria are necessary when the requirements express contractual obligations?", "opts": ["Evaluation", "Acceptance", "Approval", "Solution"], "key": "B", "expl": "When requirements express contractual obligations, they need to meet acceptance criteria defined in the contract. Acceptance criteria are the specific conditions that must be met for the requirements to be considered satisfied.", "dom": "Solution"}, {"q": "As a business analyst, you are working on a new software development project. The project manager has given you a list of features, capabilities, and technical requirements that need to be implemented. You realize that the list is quite extensive and not all items can be implemented within the given project timeline. Which technique would be most appropriate to use to manage and prioritize this list?", "opts": ["Backlog Management", "Estimation", "Data Dictionary", "Document Analysis"], "key": "A", "expl": "Backlog Management is the correct answer. In software development, a 'backlog' is a list of features, capabilities, and technical requirements that need to be implemented. Backlog Management involves prioritizing this list based on various factors such as business value, complexity, risk, and dependencies. This helps ensure that the most important items are worked on first and that the development effort is aligned with the business objectives.Option 1: Document Analysis is used to elicit requirements by analyzing existing documentation and identifying relevant information. While it can be used to understand the requirements, it does not help in managing or prioritizing them.Option 2: Estimation involves approximating the amount of work required to implement a specific requirement or feature. While it can help in planning and scheduling, it does not directly help in managing or prioritizing the requirements.Option 4: A Data Dictionary is a tool used to define and manage all the data elements in a system. While it is useful for understanding the data requirements, it does not help in managing or prioritizing the requirements.", "dom": "Requirements Analysis and Design Definition"}, {"q": "For which part of an initiative is the business analyst (BA) responsible?", "opts": ["Approving solution execution plans", "Authorizing the project", "Defining the solution approach", "Accepting risk mitigation plans"], "key": "C", "expl": "Business analysts are responsible for defining the solution approach, which involves identifying and defining the best course of action to address a business problem or opportunity.", "dom": "Solution"}, {"q": "During the analysis of the potential value of a solution, it is discovered that one of the requirements does not align with the solution scope. What should be the next step according to BABOK v3 Chapter 7 'Requirements Analysis and Design Definition'?", "opts": ["The requirement is ignored and the project continues as planned.", "The requirement is automatically eliminated from the scope.", "The requirement is marked as important and will be considered later.", "The future state must be reevaluated and the solution scope changed, or the requirement is removed."], "key": "D", "expl": "According to BABOK v3 Chapter 7, if a requirement does not align with the solution scope, the future state must be reevaluated and the solution scope changed, or the requirement is removed. This is to ensure that all requirements contribute effectively to the solution and do not divert resources or focus from the main objectives.Option 1: Marking the requirement as important and considering it later does not address the immediate issue of the requirement not aligning with the solution scope.Option 2: Ignoring the requirement could lead to potential problems in the future, as it may be an important aspect that needs to be addressed.Option 3: Automatically eliminating the requirement may not be the best solution, as it may be possible to adjust the solution scope to include the requirement.", "dom": "Requirements Analysis and Design Definition"}, {"q": "During the requirements analysis for a new software solution, the business analyst is tasked with linking the set of requirements to a solution component or a release. Who among the following stakeholders would be the most appropriate to provide recommendations regarding this task?", "opts": ["Sponsor", "Project Manager", "End User", "Domain Subject Matter Expert"], "key": "D", "expl": "The Domain Subject Matter Expert is the most suitable stakeholder to provide recommendations regarding the set of requirements to be linked to a solution component or a release. They possess specialized knowledge about the domain and understand how the requirements would fit into the overall solution and its release.Option 1: The Sponsor, while an important stakeholder, is typically involved in the project at a higher level and may not have the detailed domain knowledge necessary to provide recommendations on specific requirements.Option 2: The End User, although a key stakeholder in providing requirements, may not have the technical expertise to recommend how these requirements should be linked to a solution component or a release.Option 3: The Project Manager, while responsible for the overall management of the project, may not have the indepth domain knowledge to provide recommendations on specific requirements.", "dom": "Elicitation and Collaboration"}, {"q": "Which of the following approaches is used to determine how business analysis data will be packaged and communicated to stakeholders?", "opts": ["Governance Approach", "Business Analysis Approach", "Information Management Approach", "Stakeholder Engagement Approach"], "key": "C", "expl": "The Information Management Approach is used to determine how business analysis data will be packaged and communicated to stakeholders.", "dom": "Business Analysis Planning and Monitoring"}];
const LETTERS = ["A","B","C","D"];
const $ = id => document.getElementById(id);
let submitted = false;

function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

$("total1").textContent = QUESTIONS.length;
$("examSub").textContent = QUESTIONS.length + " câu hỏi trắc nghiệm";

/* ---------- Bắt đầu ---------- */
function start(){
  const name = $("name").value.trim();
  if (!name){ $("nameErr").textContent = "Vui lòng nhập họ và tên trước khi làm bài."; $("name").focus(); return; }
  $("nameErr").textContent = "";
  $("who").textContent = name;
  $("start").classList.add("hidden");
  $("quiz").classList.remove("hidden");
  $("dock").classList.remove("hidden");
  build();
  updateProgress();
  window.scrollTo(0,0);
}
$("startBtn").addEventListener("click", start);
$("name").addEventListener("keydown", e => { if (e.key === "Enter") start(); });

/* ---------- Dựng câu hỏi ---------- */
function build(){
  const list = $("list");
  list.textContent = "";
  QUESTIONS.forEach((q, i) => {
    const box = el("article", "q"); box.id = "q" + i;
    const h = el("h2"); h.append(el("span", null, "Câu " + (i+1) + "/" + QUESTIONS.length));
    box.append(h, el("p", "text", q.q));
    const opts = el("div", "opts");
    opts.setAttribute("role", "radiogroup");
    q.opts.forEach((t, k) => {
      const lab = el("label", "opt");
      const inp = document.createElement("input");
      inp.type = "radio"; inp.name = "q" + i; inp.value = LETTERS[k];
      inp.addEventListener("change", updateProgress);
      lab.append(inp, el("span", "k", LETTERS[k] + "."), el("span", null, t));
      opts.append(lab);
    });
    box.append(opts);
    list.append(box);
  });
}

function answerOf(i){
  const c = document.querySelector('input[name="q' + i + '"]:checked');
  return c ? c.value : null;
}
function updateProgress(){
  if (submitted) return;
  let n = 0;
  QUESTIONS.forEach((_, i) => { if (answerOf(i)) n++; });
  $("prog").textContent = "Đã trả lời " + n + "/" + QUESTIONS.length;
}

/* ---------- Giải thích: tách phần chính và phần "Option N:" ---------- */
function splitExplain(txt){
  const parts = txt.split(/\s*Option \d+:\s*/);
  return { main: parts[0].trim(), extra: parts.slice(1).map(s => s.trim()).filter(Boolean) };
}

/* ---------- Nộp bài ---------- */
function submit(){
  if (submitted) return;
  submitted = true;
  let right = 0, wrong = 0, skipped = 0;

  QUESTIONS.forEach((q, i) => {
    const box = $("q" + i);
    const picked = answerOf(i);
    const keyIdx = LETTERS.indexOf(q.key);
    box.classList.add("locked");

    let state;
    if (!picked){ state = "skip"; skipped++; }
    else if (picked === q.key){ state = "ok"; right++; }
    else { state = "bad"; wrong++; }
    box.classList.add("r-" + state);

    box.querySelector("h2").append(el("span", "badge",
      state === "ok" ? "✓ Đúng" : state === "bad" ? "✗ Sai" : "Chưa trả lời"));

    box.querySelectorAll(".opt").forEach((lab, k) => {
      const inp = lab.querySelector("input");
      inp.disabled = true;
      if (k === keyIdx){ lab.classList.add("correct"); lab.append(el("span", "tag", "✓ Đáp án đúng")); }
      else if (LETTERS[k] === picked){ lab.classList.add("wrong"); lab.append(el("span", "tag", "✗ Bạn chọn")); }
    });

    const ex = el("div", "explain");
    ex.append(el("p", "ans", "Đáp án đúng: " + q.key + ". " + q.opts[keyIdx]));
    const s = splitExplain(q.expl);
    if (s.main) ex.append(el("p", null, s.main));
    if (s.extra.length){
      const ul = el("ul");
      s.extra.forEach(t => ul.append(el("li", null, t)));
      ex.append(ul);
    }
    if (q.dom) ex.append(el("div", "domain", "Lĩnh vực: " + q.dom));
    box.append(ex);
  });

  const total = QUESTIONS.length;
  const pct = right / total * 100;
  const pctTxt = (Math.round(pct * 10) / 10).toString().replace(".", ",") + "%";
  const res = $("result");
  res.textContent = "";
  res.append(el("h2", null, "Kết quả của " + $("who").textContent));
  const stats = el("div", "stats");
  [[right + "/" + total, "Số câu đúng"], [pctTxt, "Tỷ lệ câu đúng"], [String(wrong), "Câu sai"], [String(skipped), "Chưa trả lời"]]
    .forEach(([b, s]) => { const d = el("div", "stat"); d.append(el("b", null, b), el("span", null, s)); stats.append(d); });
  const bar = el("div", "bar"); const fill = document.createElement("i"); fill.style.width = pct + "%"; bar.append(fill);
  res.append(stats, bar);
  const again = el("button", "ghost", "Làm lại bài thi"); again.type = "button"; again.style.marginTop = "16px";
  again.addEventListener("click", () => location.reload());
  res.append(again);
  res.classList.remove("hidden");

  $("whoNote").textContent = "Đã nộp bài";
  $("prog").textContent = "Đúng " + right + "/" + total + " (" + pctTxt + ")";
  $("submitBtn").textContent = "Lên đầu trang";
  $("submitBtn").onclick = () => window.scrollTo(0,0);
  window.scrollTo(0,0);
  res.focus({preventScroll:true});
}
$("submitBtn").addEventListener("click", submit);
</script>
</body>
</html>
