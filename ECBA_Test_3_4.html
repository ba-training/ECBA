<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECBA Test 3.4</title>
<style>
:root{
  color-scheme: light dark;
  --bg:#f3f6fa; --surface:#ffffff; --ink:#1a2230; --muted:#5b6678; --line:#d9e0ea;
  --brand:#1d4f91; --brand-ink:#ffffff; --brand-soft:#e4edf8;
  --ok:#17703f; --ok-soft:#e1f4e8; --bad:#a82f26; --bad-soft:#fbe6e3; --skip:#7a5a00; --skip-soft:#fbf0d2;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#10151d; --surface:#1a212c; --ink:#e8edf4; --muted:#9aa6b8; --line:#2c3646;
    --brand:#7fb0ee; --brand-ink:#0d1a2b; --brand-soft:#203248;
    --ok:#6fd49a; --ok-soft:#173526; --bad:#ff9a90; --bad-soft:#3d1f1c; --skip:#f0cf72; --skip-soft:#38300f;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 120px}
header.top{background:var(--brand);color:var(--brand-ink);padding:28px 16px;text-align:center}
header.top h1{margin:0;font-size:clamp(1.4rem,4vw,2rem);line-height:1.2;letter-spacing:.2px}
header.top p{margin:6px 0 0;opacity:.85;font-size:.95rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;margin-top:20px}
.hidden{display:none!important}
label.field{display:block;font-weight:600;margin-bottom:8px}
input[type=text]{width:100%;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input[type=text]:focus-visible,button:focus-visible,.opt:has(input:focus-visible){outline:3px solid var(--brand);outline-offset:2px}
.err{color:var(--bad);margin:8px 0 0;min-height:1.4em;font-size:.92rem}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:12px 22px;background:var(--brand);color:var(--brand-ink);cursor:pointer}
button.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand)}
button:hover{filter:brightness(1.08)}
.who{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:.95rem;margin-top:20px}
.who strong{color:var(--ink)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;margin-top:16px;border-left-width:6px}
.q h2{margin:0 0 4px;font-size:.95rem;color:var(--muted);font-weight:600;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.q .text{margin:0 0 14px;font-size:1.05rem;font-weight:600}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--bg)}
.opt:hover{border-color:var(--brand)}
.opt input{margin-top:5px;accent-color:var(--brand)}
.opt .k{font-weight:700;min-width:1.3em}
.opt:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.locked .opt{cursor:default}
.locked .opt:hover{border-color:var(--line)}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt .tag{margin-left:auto;font-size:.85rem;font-weight:700;white-space:nowrap;padding-left:8px}
.opt.correct .tag{color:var(--ok)} .opt.wrong .tag{color:var(--bad)}
.q.r-ok{border-left-color:var(--ok)} .q.r-bad{border-left-color:var(--bad)} .q.r-skip{border-left-color:var(--skip)}
.badge{font-size:.85rem;font-weight:700;padding:2px 10px;border-radius:99px}
.r-ok .badge{background:var(--ok-soft);color:var(--ok)}
.r-bad .badge{background:var(--bad-soft);color:var(--bad)}
.r-skip .badge{background:var(--skip-soft);color:var(--skip)}
.explain{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.explain .ans{margin:0 0 8px;font-weight:700}
.explain p{margin:0 0 8px}
.explain ul{margin:6px 0 0;padding-left:20px;color:var(--muted)}
.explain li{margin-bottom:6px}
.domain{font-size:.85rem;color:var(--muted);margin-top:8px}
.result{border-width:2px;border-color:var(--brand)}
.result h2{margin:0 0 12px;font-size:1.25rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px}
.stat b{display:block;font-size:1.7rem;line-height:1.2}
.stat span{color:var(--muted);font-size:.9rem}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px}
.dock .in{max-width:820px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.dock .prog{color:var(--muted);font-size:.95rem}
.note{color:var(--muted);font-size:.92rem;margin:10px 0 0}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<header class="top">
  <h1 id="examTitle">ECBA Test 3.4</h1>
  <p id="examSub"></p>
</header>

<main class="wrap">
  <section id="start" class="card">
    <label class="field" for="name">Nhập họ và tên của bạn để bắt đầu làm bài</label>
    <input id="name" type="text" autocomplete="name" placeholder="Ví dụ: Nguyễn Văn A" maxlength="80">
    <p class="err" id="nameErr" role="alert"></p>
    <button id="startBtn" type="button">Bắt đầu làm bài</button>
    <p class="note">Bài gồm <span id="total1"></span> câu trắc nghiệm. Bạn có thể nộp bài bất cứ lúc nào; câu chưa trả lời sẽ tính là sai.</p>
  </section>

  <section id="quiz" class="hidden">
    <div class="who"><span>Thí sinh: <strong id="who"></strong></span><span id="whoNote"></span></div>
    <div id="result" class="card result hidden" tabindex="-1"></div>
    <form id="form" onsubmit="return false"><div id="list"></div></form>
  </section>
</main>

<div class="dock hidden" id="dock">
  <div class="in">
    <span class="prog" id="prog"></span>
    <button id="submitBtn" type="button">Nộp bài</button>
  </div>
</div>

<script>
const QUESTIONS = [{"q": "As a Business Analyst, you are working on a project with multiple requirements. You have been tasked to prioritize these requirements. Which of the following best describes how the 'Estimation' technique would help you in this context?", "opts": ["The 'Estimation' technique will help you estimate the number of stakeholders needed for requirement prioritization.", "The 'Estimation' technique will help you estimate the number of requirements that need to be prioritized.", "The 'Estimation' technique will help you produce estimates for the basis of prioritization.", "The 'Estimation' technique will help you estimate the time taken to prioritize each requirement."], "key": "C", "expl": "The 'Estimation' technique is used in requirement prioritization to produce estimates that serve as the basis for prioritization. These estimates could be related to the cost, time, effort, or value associated with implementing each requirement. By comparing these estimates, you can determine which requirements should be prioritized over others.Option 1: The 'Estimation' technique is not primarily used to estimate the number of stakeholders needed for requirement prioritization. While stakeholders' inputs are crucial in requirement prioritization, the number of stakeholders is not usually a factor that is estimated using this technique.Option 2: The 'Estimation' technique is not used to estimate the number of requirements that need to be prioritized. All requirements identified during the requirement elicitation process typically need to be prioritized.Option 4: While the 'Estimation' technique might help in estimating the time taken to prioritize each requirement, this is not its primary purpose. The main purpose of this technique in requirement prioritization is to produce estimates that serve as the basis for prioritization.", "dom": "Techniques"}, {"q": "According to BABOK® v3, measures of effective trustworthiness for business analysts are defined. Which of the following is one of them?", "opts": ["Maintaining a consistent schedule over a long period of time", "Delivering complete and relevant solutions", "Completing tasks and deliverables within budget", "Stakeholders bringing issues and concerns to the business analyst"], "key": "D", "expl": "The BABOK® v3 mentions that a measure of effective trustworthiness for business analysts is stakeholders involving the business analyst in discussions and decisionmaking, as well as bringing issues and concerns to the business analyst. This indicates that stakeholders trust the business analyst and feel comfortable discussing difficult or controversial topics with them.Options B, C, and D are not specifically mentioned as measures of trustworthiness in BABOK® v3BABOK v3 Chapter 9.2.3", "dom": "Underlying Competencies"}, {"q": "A company is looking to improve its customer service experience. As a business analyst, you have been tasked with eliciting requirements from various stakeholders. What is your primary role during this Guide Elicitation Activity?", "opts": ["To provide technical support to the stakeholders involved in the elicitation", "To provide the financial resources needed for the elicitation activity", "To design the solution based on the elicited information", "To ensure that the elicitation activities are focused on producing the intended information at the desired level of detail"], "key": "D", "expl": "The BABOK® v3 mentions that a measure of effective trustworthiness for business analysts is stakeholders involving the business analyst in discussions and decisionmaking, as well as bringing issues and concerns to the business analyst. This indicates that stakeholders trust the business analyst and feel comfortable discussing difficult or controversial topics with them.Options B, C, and D are not specifically mentioned as measures of trustworthiness in BABOK® v3BABOK v3 Chapter 9.2.3", "dom": "Elicitation and Collaboration"}, {"q": "You are a business analyst working on a project that involves integrating multiple systems. Your team is currently performing Interface Analysis. Which of the following is NOT a typical goal of this analysis?", "opts": ["Analyze and define the behavior of system components at their boundaries", "Identify where information is exchanged between systems", "Improve user interface design", "Identify business rules associated with data transfer"], "key": "C", "expl": "Interface Analysis is primarily concerned with understanding how systems exchange information and interact with each other. It involves identifying points of information exchange, defining system behaviors at their boundaries, and understanding business rules associated with data transfer. While user interface design is an important aspect of system development, it is not typically a goal of Interface Analysis. User interface design is more focused on the interaction between users and the system, rather than the interaction between systems.Option 1: Identifying where information is exchanged between systems is a key goal of Interface Analysis. This helps to ensure that all necessary data is accurately and efficiently transferred between systems.Option 3: Analyzing and defining the behavior of system components at their boundaries is another important goal of Interface Analysis. This helps to ensure that each system can correctly interpret and respond to the data it receives.Option 4: Identifying business rules associated with data transfer is also a typical goal of Interface Analysis. These rules may dictate how data is formatted, when it is transferred, and how errors are handled.", "dom": "Techniques"}, {"q": "Video conferencing, electronic calendars, and electronic voting are examples of:", "opts": ["word processing tools.", "knowledge management tools.", "collaboration tools.", "mapping tools."], "key": "C", "expl": "Video conferencing, electronic calendars, and electronic voting are tools that facilitate collaboration and communication among team members. They fall under the category of collaboration tools.", "dom": "Elicitation and Collaboration"}, {"q": "A particular requirement wasn't approved for the current software release. Why might the team still maintain it?", "opts": ["They can be used to elicit new requirements.", "They can be used for performance assessment of the project team.", "They can be referenced to confirm compliance to standards.", "They may become organizational process assets."], "key": "D", "expl": "According to BABOK® v3, requirements that were not approved or implemented may be maintained for possible future initiatives, indicating that they may become organizational process assets or be used in future initiatives. The other options, while important aspects of requirements management are not specifically mentioned in the context of maintaining unapproved or unimplemented requirements.BABOK v3 Chapter 5.2.8", "dom": "Solution"}, {"q": "What is the purpose of using a matrix in the context of business analysis?", "opts": ["To model a requirement or set of requirements that have a complex but uniform structure.", "To visualize data flow requirements.", "To provide a visual, often pictorial, representation of a requirement or set of requirements.", "To record the meaning of relevant business terms while analyzing requirements."], "key": "A", "expl": "The correct answer is B. In the context of business analysis, a matrix is used to model a requirement or set of requirements that have a complex but uniform structure, which can be broken down into elements that apply to every entry in the table.Option A, 'To provide a visual, often pictorial, representation of a requirement or set of requirements', is incorrect as this describes the use of diagrams, not matrices.Option C, 'To record the meaning of relevant business terms while analyzing requirements', is incorrect because this function is typically served by a Glossary, not a matrix.Option D, 'To visualize data flow requirements', is also incorrect as this describes the use of Data Flow Diagrams, not matrices.BABOK v3 Chapter 7.1.4", "dom": "Requirements Analysis and Design Definition"}, {"q": "What type of requirements are less subject to revision during a change?", "opts": ["Requirements identified by Business Rules Analysis", "Requirements expressed in detail", "Requirements tied to a specific tool or organizational structure", "Requirements represented in a general manner without direct ties to a particular tool or organizational structure"], "key": "D", "expl": "According to BABOK® v3 requirements that are represented in a general manner, without direct ties to a particular tool or organizational structure, tend to be more reusable and less subject to revision during a change. Specificity and ties to particular tools or structures may limit the reuse of requirements and make them more prone to revisions.BABOK v3 Chapter 5.2.4", "dom": "Need"}, {"q": "Which technique in Trace Requirements is used to visually depict scope and trace requirements to the area of scope the requirement supports?", "opts": ["Business Rules Analysis", "Functional Decomposition", "Scope Modelling", "Process Modelling"], "key": "C", "expl": "Scope Modelling is used to visually depict scope and trace requirements to the area of scope the requirement supports (Section 5.1.6).Option A, \"Business Rules Analysis,\" is incorrect as this technique is used to trace business rules to requirements.Option B, \"Functional Decomposition,\" is incorrect as it is used to break down solution scope into smaller components for allocation.Option C, \"Process Modelling,\" is incorrect as it is used to visually show the future state process, not the scope.BABOK v3 Chapter 5.1.6", "dom": "Requirements Life Cycle Management"}, {"q": "What is the main purpose of the 'Approve Requirements' task?", "opts": ["Establish requirements baseline", "Assess alternative approaches", "Select appropriate techniques", "Obtain agreement"], "key": "D", "expl": "The main purpose of the Approve Requirements task is to obtain agreement from relevant stakeholders on the defined requirements. This ensures that everyone is aligned with the documented requirements.", "dom": "Requirements Life Cycle Management"}, {"q": "As a business analyst, you are in the phase of analyzing potential value and recommending solutions. You have gathered a list of needs from stakeholders and are now looking into possible solutions. Which of the following statements best describes the relationship between these two sets of information?", "opts": ["Requirements are created by stakeholders, while designs are created by business analysts.", "Requirements are abstract, while designs are concrete.", "Requirements focus on the need, while designs focus on the solution.", "Requirements are static, while designs are dynamic."], "key": "C", "expl": "The correct answer is Option3. In the context of business analysis, requirements refer to the needs or conditions that a product or service must satisfy. They are typically focused on what the stakeholder needs or wants. On the other hand, designs are about how these needs or wants will be met. Therefore, requirements focus on the need, while designs focus on the solution. This is a key concept in the Requirements Analysis and Design Definition knowledge area, and specifically in the task of Analyzing Potential Value and Recommending Solution.Option Option1: This statement is not entirely accurate. While stakeholders often play a key role in defining requirements, and business analysts are typically involved in creating designs, this is not a hard and fast rule. The roles and responsibilities can vary depending on the project and organization.Option Option2: This statement is incorrect. Both requirements and designs can evolve over time, depending on changes in business needs, technology, and other factors. Therefore, it's not accurate to say that requirements are static and designs are dynamic.Option Option4: This statement is not entirely accurate. While it's true that designs often provide a more concrete representation of a solution, requirements can also be quite specific and detailed. The level of abstraction or concreteness can vary for both requirements and designs.", "dom": "Business Analysis and the BA Professional"}, {"q": "Which of the following techniques is used to identify the elements and boundaries of the requirements architecture?", "opts": ["Scope modelling", "Environmental scan", "Functional decomposition", "Interface analysis"], "key": "A", "expl": "Scope modeling is a technique used to identify the elements and boundaries of the requirements architecture, helping to define what is within the scope of the project.", "dom": "Techniques"}, {"q": "Your company is developing a new software product and you are the business analyst. You are required to engage both internal and external stakeholders. Why would you need to plan different collaboration approaches for these groups?", "opts": ["To ensure stakeholders' interest and involvement is maintained across the initiative", "To increase the cost and complexity of the business analysis activities", "To identify the geographic location of stakeholders", "To confuse stakeholders with varying approaches"], "key": "A", "expl": "The correct answer is 'To ensure stakeholders' interest and involvement is maintained across the initiative'. Different stakeholders have different interests, concerns, and levels of influence in an initiative. It's critical to plan different collaboration approaches to address these differences and ensure that all stakeholders are appropriately engaged and their interests are taken into account. This helps in maintaining their interest and involvement across the initiative.Option 2: Confusing stakeholders with varying approaches is not a good practice. The aim should be to engage stakeholders effectively, not to confuse them.Option 3: Increasing the cost and complexity of the business analysis activities is not the aim of planning different collaboration approaches for different stakeholders. The aim should be to engage stakeholders effectively.Option 4: Identifying the geographic location of stakeholders is not the primary reason for planning different collaboration approaches. While the location may impact the collaboration approach, it is not the main factor.", "dom": "Elicitation and Collaboration"}, {"q": "You are a business analyst working for a software company that is planning to develop a new software product. The project manager asks you to analyze the potential value of the project. Which of the following would you consider as part of the expected costs during your analysis?", "opts": ["The potential increase in sales revenue", "The cost of the software development tools", "The potential value of the project", "The stakeholders' opinions on the project"], "key": "B", "expl": "The cost of the software development tools is an expected cost during the analysis of potential value. This includes the cost of licenses, hardware, and other resources needed for the development process. (BABOK v3 Chapter 7.6)Option 2: The potential increase in sales revenue is a potential benefit, not a cost. It should be included in the analysis of potential value, but it is not a cost.Option 3: The stakeholders' opinions on the project are important for the business analysis, but they are not a cost.Option 4: The potential value of the project is the result of the analysis, not a cost.", "dom": "Business Analysis Planning and Monitoring"}, {"q": "What type of knowledge equips a business analyst (BA) with understanding market forces, customer segments, services, products, andregulations?", "opts": ["Industry", "Organizational", "Solution", "Methodological"], "key": "A", "expl": "The correct type of knowledge in this context is \"Industry\" knowledge. Business Analysts need to understand the specific industry in which their organization operates, as it includes knowledge of market forces, customer segments, services, products, and regulations.", "dom": "BA Key Concepts"}];
const LETTERS = ["A","B","C","D"];
const $ = id => document.getElementById(id);
let submitted = false;

function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

$("total1").textContent = QUESTIONS.length;
$("examSub").textContent = QUESTIONS.length + " câu hỏi trắc nghiệm";

/* ---------- Bắt đầu ---------- */
function start(){
  const name = $("name").value.trim();
  if (!name){ $("nameErr").textContent = "Vui lòng nhập họ và tên trước khi làm bài."; $("name").focus(); return; }
  $("nameErr").textContent = "";
  $("who").textContent = name;
  $("start").classList.add("hidden");
  $("quiz").classList.remove("hidden");
  $("dock").classList.remove("hidden");
  build();
  updateProgress();
  window.scrollTo(0,0);
}
$("startBtn").addEventListener("click", start);
$("name").addEventListener("keydown", e => { if (e.key === "Enter") start(); });

/* ---------- Dựng câu hỏi ---------- */
function build(){
  const list = $("list");
  list.textContent = "";
  QUESTIONS.forEach((q, i) => {
    const box = el("article", "q"); box.id = "q" + i;
    const h = el("h2"); h.append(el("span", null, "Câu " + (i+1) + "/" + QUESTIONS.length));
    box.append(h, el("p", "text", q.q));
    const opts = el("div", "opts");
    opts.setAttribute("role", "radiogroup");
    q.opts.forEach((t, k) => {
      const lab = el("label", "opt");
      const inp = document.createElement("input");
      inp.type = "radio"; inp.name = "q" + i; inp.value = LETTERS[k];
      inp.addEventListener("change", updateProgress);
      lab.append(inp, el("span", "k", LETTERS[k] + "."), el("span", null, t));
      opts.append(lab);
    });
    box.append(opts);
    list.append(box);
  });
}

function answerOf(i){
  const c = document.querySelector('input[name="q' + i + '"]:checked');
  return c ? c.value : null;
}
function updateProgress(){
  if (submitted) return;
  let n = 0;
  QUESTIONS.forEach((_, i) => { if (answerOf(i)) n++; });
  $("prog").textContent = "Đã trả lời " + n + "/" + QUESTIONS.length;
}

/* ---------- Giải thích: tách phần chính và phần "Option N:" ---------- */
function splitExplain(txt){
  const parts = txt.split(/\s*Option \d+:\s*/);
  return { main: parts[0].trim(), extra: parts.slice(1).map(s => s.trim()).filter(Boolean) };
}

/* ---------- Nộp bài ---------- */
function submit(){
  if (submitted) return;
  submitted = true;
  let right = 0, wrong = 0, skipped = 0;

  QUESTIONS.forEach((q, i) => {
    const box = $("q" + i);
    const picked = answerOf(i);
    const keyIdx = LETTERS.indexOf(q.key);
    box.classList.add("locked");

    let state;
    if (!picked){ state = "skip"; skipped++; }
    else if (picked === q.key){ state = "ok"; right++; }
    else { state = "bad"; wrong++; }
    box.classList.add("r-" + state);

    box.querySelector("h2").append(el("span", "badge",
      state === "ok" ? "✓ Đúng" : state === "bad" ? "✗ Sai" : "Chưa trả lời"));

    box.querySelectorAll(".opt").forEach((lab, k) => {
      const inp = lab.querySelector("input");
      inp.disabled = true;
      if (k === keyIdx){ lab.classList.add("correct"); lab.append(el("span", "tag", "✓ Đáp án đúng")); }
      else if (LETTERS[k] === picked){ lab.classList.add("wrong"); lab.append(el("span", "tag", "✗ Bạn chọn")); }
    });

    const ex = el("div", "explain");
    ex.append(el("p", "ans", "Đáp án đúng: " + q.key + ". " + q.opts[keyIdx]));
    const s = splitExplain(q.expl);
    if (s.main) ex.append(el("p", null, s.main));
    if (s.extra.length){
      const ul = el("ul");
      s.extra.forEach(t => ul.append(el("li", null, t)));
      ex.append(ul);
    }
    if (q.dom) ex.append(el("div", "domain", "Lĩnh vực: " + q.dom));
    box.append(ex);
  });

  const total = QUESTIONS.length;
  const pct = right / total * 100;
  const pctTxt = (Math.round(pct * 10) / 10).toString().replace(".", ",") + "%";
  const res = $("result");
  res.textContent = "";
  res.append(el("h2", null, "Kết quả của " + $("who").textContent));
  const stats = el("div", "stats");
  [[right + "/" + total, "Số câu đúng"], [pctTxt, "Tỷ lệ câu đúng"], [String(wrong), "Câu sai"], [String(skipped), "Chưa trả lời"]]
    .forEach(([b, s]) => { const d = el("div", "stat"); d.append(el("b", null, b), el("span", null, s)); stats.append(d); });
  const bar = el("div", "bar"); const fill = document.createElement("i"); fill.style.width = pct + "%"; bar.append(fill);
  res.append(stats, bar);
  const again = el("button", "ghost", "Làm lại bài thi"); again.type = "button"; again.style.marginTop = "16px";
  again.addEventListener("click", () => location.reload());
  res.append(again);
  res.classList.remove("hidden");

  $("whoNote").textContent = "Đã nộp bài";
  $("prog").textContent = "Đúng " + right + "/" + total + " (" + pctTxt + ")";
  $("submitBtn").textContent = "Lên đầu trang";
  $("submitBtn").onclick = () => window.scrollTo(0,0);
  window.scrollTo(0,0);
  res.focus({preventScroll:true});
}
$("submitBtn").addEventListener("click", submit);
</script>
</body>
</html>
