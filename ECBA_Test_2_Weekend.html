<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECBA Test 2 Weekend</title>
<style>
:root{
  color-scheme: light dark;
  --bg:#f3f6fa; --surface:#ffffff; --ink:#1a2230; --muted:#5b6678; --line:#d9e0ea;
  --brand:#1d4f91; --brand-ink:#ffffff; --brand-soft:#e4edf8;
  --ok:#17703f; --ok-soft:#e1f4e8; --bad:#a82f26; --bad-soft:#fbe6e3; --skip:#7a5a00; --skip-soft:#fbf0d2;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#10151d; --surface:#1a212c; --ink:#e8edf4; --muted:#9aa6b8; --line:#2c3646;
    --brand:#7fb0ee; --brand-ink:#0d1a2b; --brand-soft:#203248;
    --ok:#6fd49a; --ok-soft:#173526; --bad:#ff9a90; --bad-soft:#3d1f1c; --skip:#f0cf72; --skip-soft:#38300f;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 120px}
header.top{background:var(--brand);color:var(--brand-ink);padding:28px 16px;text-align:center}
header.top h1{margin:0;font-size:clamp(1.4rem,4vw,2rem);line-height:1.2;letter-spacing:.2px}
header.top p{margin:6px 0 0;opacity:.85;font-size:.95rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;margin-top:20px}
.hidden{display:none!important}
label.field{display:block;font-weight:600;margin-bottom:8px}
input[type=text]{width:100%;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input[type=text]:focus-visible,button:focus-visible,.opt:has(input:focus-visible){outline:3px solid var(--brand);outline-offset:2px}
.err{color:var(--bad);margin:8px 0 0;min-height:1.4em;font-size:.92rem}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:12px 22px;background:var(--brand);color:var(--brand-ink);cursor:pointer}
button.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand)}
button:hover{filter:brightness(1.08)}
.who{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:.95rem;margin-top:20px}
.who strong{color:var(--ink)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;margin-top:16px;border-left-width:6px}
.q h2{margin:0 0 4px;font-size:.95rem;color:var(--muted);font-weight:600;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.q .text{margin:0 0 14px;font-size:1.05rem;font-weight:600}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--bg)}
.opt:hover{border-color:var(--brand)}
.opt input{margin-top:5px;accent-color:var(--brand)}
.opt .k{font-weight:700;min-width:1.3em}
.opt:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.locked .opt{cursor:default}
.locked .opt:hover{border-color:var(--line)}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt .tag{margin-left:auto;font-size:.85rem;font-weight:700;white-space:nowrap;padding-left:8px}
.opt.correct .tag{color:var(--ok)} .opt.wrong .tag{color:var(--bad)}
.q.r-ok{border-left-color:var(--ok)} .q.r-bad{border-left-color:var(--bad)} .q.r-skip{border-left-color:var(--skip)}
.badge{font-size:.85rem;font-weight:700;padding:2px 10px;border-radius:99px}
.r-ok .badge{background:var(--ok-soft);color:var(--ok)}
.r-bad .badge{background:var(--bad-soft);color:var(--bad)}
.r-skip .badge{background:var(--skip-soft);color:var(--skip)}
.explain{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.explain .ans{margin:0 0 8px;font-weight:700}
.explain p{margin:0 0 8px}
.explain ul{margin:6px 0 0;padding-left:20px;color:var(--muted)}
.explain li{margin-bottom:6px}
.domain{font-size:.85rem;color:var(--muted);margin-top:8px}
.result{border-width:2px;border-color:var(--brand)}
.result h2{margin:0 0 12px;font-size:1.25rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px}
.stat b{display:block;font-size:1.7rem;line-height:1.2}
.stat span{color:var(--muted);font-size:.9rem}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px}
.dock .in{max-width:820px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.dock .prog{color:var(--muted);font-size:.95rem}
.note{color:var(--muted);font-size:.92rem;margin:10px 0 0}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<header class="top">
  <h1 id="examTitle">ECBA Test 2 Weekend</h1>
  <p id="examSub"></p>
</header>

<main class="wrap">
  <section id="start" class="card">
    <label class="field" for="name">Nhập họ và tên của bạn để bắt đầu làm bài</label>
    <input id="name" type="text" autocomplete="name" placeholder="Ví dụ: Nguyễn Văn A" maxlength="80">
    <p class="err" id="nameErr" role="alert"></p>
    <button id="startBtn" type="button">Bắt đầu làm bài</button>
    <p class="note">Bài gồm <span id="total1"></span> câu trắc nghiệm. Bạn có thể nộp bài bất cứ lúc nào; câu chưa trả lời sẽ tính là sai.</p>
  </section>

  <section id="quiz" class="hidden">
    <div class="who"><span>Thí sinh: <strong id="who"></strong></span><span id="whoNote"></span></div>
    <div id="result" class="card result hidden" tabindex="-1"></div>
    <form id="form" onsubmit="return false"><div id="list"></div></form>
  </section>
</main>

<div class="dock hidden" id="dock">
  <div class="in">
    <span class="prog" id="prog"></span>
    <button id="submitBtn" type="button">Nộp bài</button>
  </div>
</div>

<script>
const QUESTIONS = [{"q": "During a project, the business analyst is focusing on identifying potential value and recommending a solution. The project involves tracking the progress of physical items through a supply chain. Which technique is NOT typically used for this purpose?", "opts": ["Decision Analysis", "Stakeholder Analysis", "Item Tracking", "Risk Assessment"], "key": "C", "expl": "The technique of 'Item Tracking' is not typically used when identifying potential value and recommending a solution. This technique is more relevant to operational tasks such as supply chain management or inventory control. In the context of business analysis, techniques such as Stakeholder Analysis, Risk Assessment, and Decision Analysis are more commonly used to identify improvement opportunities and make informed decisions.Option 2: Stakeholder Analysis is often used in the process of identifying potential value and recommending solutions. This technique involves identifying key stakeholders and understanding their influence and interest in the project.Option 3: Risk Assessment is a crucial technique used in business analysis. It helps identify potential threats and vulnerabilities that could impact the project's success.Option 4: Decision Analysis is a systematic, quantitative, and visual approach to addressing and evaluating important choices confronted by businesses. Therefore, it is typically used in the process of identifying potential value and recommending solutions.", "dom": "Techniques"}, {"q": "You are a Business Analyst working on a project. The project has a critical requirement that has recently undergone a substantial change. This change is expected to have a significant impact on the project. Which tool would be most beneficial for you to analyze the implications of this change?", "opts": ["Traceability", "CostBenefit Analysis", "PEST Analysis", "SWOT Analysis"], "key": "A", "expl": "Traceability is the correct answer. Traceability is a tool that allows business analysts to track the relationship between requirements and other deliverables. This is particularly useful when a requirement changes, as it allows the analyst to understand the impact of the change on the project as a whole. This includes impacts on the project's scope, cost, schedule, and quality. Therefore, traceability is the most useful tool for analyzing the implications of a significant change in a requirement.Option 1: SWOT Analysis is a strategic planning tool used to identify and analyze the Strengths, Weaknesses, Opportunities, and Threats related to business competition or project planning. It is not typically used to analyze the implications of a change in a project requirement.Option 2: PEST Analysis is a framework that strategy consultants use to scan the external macroenvironment in which a firm operates. PEST is an acronym for Political, Economic, Social, and Technological factors, which are used to assess the market for a business or organizational unit. It is not typically used to analyze the implications of a change in a project requirement.Option 3: CostBenefit Analysis is a process used by organizations to analyze decisions. The business or analyst sums the benefits of a situation or action and then subtracts the costs associated with taking that action. It is not typically used to analyze the implications of a change in a project requirement.", "dom": "Techniques"}, {"q": "In the context of Requirements Analysis and Design Definition, your team is considering several potential solutions to meet a newly identified need in your organization. How should changes in the business environment be taken into account during this process?", "opts": ["Changes and needs are interchangeable; therefore, any change will automatically meet the needs.", "Changes should be ignored as they are unrelated to the identified needs.", "Changes in the business environment could lead to new needs, affecting the potential value of the proposed solutions.", "Changes in the business environment cannot affect the identified needs."], "key": "C", "expl": "In the Requirements Analysis and Design Definition process, it is crucial to consider changes in the business environment. These changes can lead to new needs or modify existing ones, thus affecting the potential value of the proposed solutions. Ignoring these changes could result in solutions that no longer meet the organization's needs or fail to maximize value.Option 1: Ignoring changes in the business environment can lead to solutions that do not meet the organization's needs or fail to maximize value. This approach is not recommended.Option 2: Changes in the business environment can indeed affect the identified needs by creating new needs or modifying existing ones. This option is incorrect.Option 4: Changes and needs are not interchangeable terms. A change in the business environment can lead to new needs, but it does not automatically meet these needs. This option is incorrect.", "dom": "Requirements Analysis and Design Definition"}, {"q": "Which core concept defines a specific way of satisfying one or more needs in a context?", "opts": ["Value", "Change", "Solution", "Priority"], "key": "C", "expl": "The core concept \"Solution\" defines a specific way of satisfying one or more needs in a context. It relates to the creation or design of solutions to address business needs.", "dom": "Solution"}, {"q": "An atomic requirement:", "opts": ["contains no extraneous or unnecessary content.", "uses common terminology understood by the audience.", "aligns with the identified needs of the stakeholders.", "is understood independently of other requirements or designs."], "key": "D", "expl": "An atomic requirement is one that stands on its own and is understood independently of other requirements or designs. It should be selfcontained and not dependent on external factors.", "dom": "BA Key Concepts"}, {"q": "You are a Business Analyst working on a new software project. The project team is in the process of analyzing potential value and recommending a solution. Which of the following techniques would NOT typically be used in this stage according to BABOK® v3?", "opts": ["Risk Analysis and Management", "Collaborative Games", "Brainstorming", "Lessons Learned"], "key": "C", "expl": "Brainstorming is a useful technique for generating ideas and solutions in a group setting. However, it is typically used in the earlier stages of a project to identify potential solutions, not in the stage of analyzing potential value and recommending a solution. In this stage, techniques such as Collaborative Games, Lessons Learned, and Risk Analysis and Management would be more commonly used according to BABOK® v3.Option 2: Collaborative Games can be a useful technique in this stage as they can help to engage stakeholders and encourage creative thinking about potential solutions.Option 3: Lessons Learned is a technique that involves reviewing past experiences and results to inform future decisions and actions. It can be particularly useful in this stage as it can help to identify potential risks and benefits of different solutions.Option 4: Risk Analysis and Management is a crucial technique in this stage as it involves identifying, assessing, and managing potential risks associated with different solutions.", "dom": "Techniques"}, {"q": "As a Business Analyst, you are using the Business Model Canvas to analyze the business model of your organization. Which of the following is NOT a part of the Business Model Canvas?", "opts": ["Channels", "Customer Segments", "Value Propositions", "Employee Evaluation"], "key": "D", "expl": "The Business Model Canvas is a strategic management and lean startup template for developing new or documenting existing business models. It consists of nine building blocks: Customer Segments, Value Propositions, Channels, Customer Relationships, Revenue Streams, Key Resources, Key Activities, Key Partnerships, and Cost Structure. Therefore, Employee Evaluation is not a part of the Business Model Canvas.Option 1: Value Propositions is one of the nine building blocks of the Business Model Canvas. It describes the bundle of products and services that create value for a specific Customer Segment.Option 2: Customer Segments is one of the nine building blocks of the Business Model Canvas. It defines the different groups of people or organizations an enterprise aims to reach and serve.Option 3: Channels is one of the nine building blocks of the Business Model Canvas. It describes how a company communicates with and reaches its Customer Segments to deliver a Value Proposition.", "dom": "Business analysis key concepts"}, {"q": "Which of the following techniques is used when recommendations for improvement are supported by objective and quantitative evidence?", "opts": ["Observation", "Estimation", "Functional decomposition", "Balanced scorecard"], "key": "D", "expl": "The Balanced Scorecard is a technique that helps measure and improve the performance of an organization using a balanced set of quantitative and qualitative measures. It supports recommendations for improvement based on objective evidence.", "dom": "Techniques"}, {"q": "Establishing the design option that is appropriate to meet the enterprise's requirements is the purpose of which task?", "opts": ["Define design options", "Analyze potential value and recommend solution", "Specify and model requirements", "Define requirements architecture"], "key": "B", "expl": "The task of analyzing potential value and recommending a solution is focused on establishing the design option that is appropriate to meet the enterprise's requirements.", "dom": "Requirements Analysis and Design Definition"}, {"q": "Stakeholders commonly face challenges in prioritizing requirements due to:", "opts": ["different perceived values.", "inability to work with others.", "project time constraints.", "lack of knowledge."], "key": "A", "expl": "Stakeholders often face challenges in prioritizing requirements due to different perceived values and priorities.", "dom": "Stakeholder"}, {"q": "Your team is working on a project with a tight deadline and you are in charge of prioritizing the requirements. One of the requirements is timesensitive. In this context, what does 'time sensitive' mean?", "opts": ["The requirement needs to be tested after a specific time period postimplementation.", "The requirement takes a long time to implement.", "The requirement is dependent on other timebound tasks.", "The requirement retains its value only within a specific timeframe."], "key": "D", "expl": "In the context of prioritizing requirements, 'timesensitive' means that a requirement retains its value only within a specific timeframe. This could be due to various factors such as market conditions, regulatory changes, or technological advancements. Therefore, such requirements need to be implemented within that specific timeframe to ensure they deliver the expected value.Option 1: While some requirements may be dependent on other tasks, this is not what is meant by 'timesensitive'. Timesensitive refers to the value of the requirement within a specific timeframe.Option 2: The time taken to implement a requirement does not define its 'time sensitivity'. A timesensitive requirement is one that retains its value only within a specific timeframe, regardless of the implementation time.Option 3: The time taken to test a requirement postimplementation does not define its 'time sensitivity'. Time sensitivity refers to the timeframe within which the requirement retains its value.", "dom": "Requirements Analysis and Design Definition"}, {"q": "You are a business analyst working on a project to develop a new software product. The project is in the Requirements Analysis and Design Definition phase. You have identified several potential solutions to meet the business needs. Who should you primarily collaborate with to analyze potential value and recommend a solution?", "opts": ["Project Manager", "Software Developer", "End User & Customer", "Tester"], "key": "C", "expl": "In the Requirements Analysis and Design Definition phase, business analysts primarily collaborate with end users and customers to analyze potential value and recommend a solution. This is because end users and customers are the ones who will use the product and thus, can provide valuable insights about the potential value of the solution. They can also provide feedback on the proposed solution and suggest improvements.Option 1: While the project manager is an important stakeholder, they are not primarily involved in analyzing potential value and recommending a solution. Their main role is to manage the project and ensure it is completed on time and within budget.Option 3: Software developers are responsible for implementing the solution, not analyzing its potential value or recommending it. They rely on the business analyst to provide them with the requirements and the recommended solution.Option 4: Testers are responsible for testing the solution to ensure it meets the requirements. They do not typically participate in analyzing potential value or recommending the solution.", "dom": "Elicitation and Collaboration"}, {"q": "What is the relationship between two requirements called when one requirement can be deduced from another at a higher level?", "opts": ["Derive", "Necessity", "Satisfy", "Effort"], "key": "A", "expl": "The relationship between two requirements where one requirement can be deduced from another at a higher level is called a \"Derive\" relationship. This indicates that a lowerlevel requirement can be derived from a higherlevel one.", "dom": "Understanding Business Analysis"}, {"q": "A software development company is conducting a focus group to understand user requirements for a new application. The focus group includes stakeholders from various departments. Who is primarily responsible for facilitating this focus group?", "opts": ["The Sponsor", "The Software Developer", "The Project Manager", "The Business Analyst"], "key": "D", "expl": "The Business Analyst is primarily responsible for facilitating focus groups. They are responsible for gathering, analyzing, and prioritizing business needs. In a focus group, they guide the discussion to ensure that the necessary information is obtained. They also ensure that all participants have an opportunity to express their views.Option 1: The Project Manager is responsible for the overall management of the project, which includes planning, executing, monitoring, controlling, and closing the project. They may attend the focus group, but they are not primarily responsible for facilitating it.Option 2: The Sponsor is the individual or group who provides the financial resources for the project. They may participate in the focus group, but they are not the main facilitator.Option 4: The Software Developer is responsible for designing and coding the application. They may use the information from the focus group to inform their work, but they are not the main facilitator of the focus group.", "dom": "Elicitation and Collaboration"}, {"q": "As a business analyst, you are conducting an interview with a stakeholder to gather information about a specific topic. Which of the following is NOT a typical goal of this interview?", "opts": ["To understand the stakeholder's perspective and motivations", "To gain consensus among stakeholders", "To validate information gathered from other sources", "To gather detailed information about the specific topic"], "key": "B", "expl": "In the context of business analysis, the primary goal of an interview is to gather detailed information about a specific topic, understand the stakeholder's perspective and motivations, and validate information gathered from other sources. While gaining consensus among stakeholders is an important part of the business analysis process, it is not typically a goal of the interview process itself. Interviews are more focused on information gathering and understanding perspectives rather than decisionmaking or consensusbuilding.Option 1: Understanding the stakeholder's perspective and motivations is a key goal of the interview process in business analysis. This option is incorrect.Option 2: Validating information gathered from other sources is another important goal of the interview process. This option is incorrect.Option 4: Gathering detailed information about a specific topic is the primary goal of the interview process. This option is incorrect.", "dom": "Elicitation and Collaboration"}, {"q": "A project manager is considering implementing a new software solution to increase efficiency. However, resources are constrained. What should the project manager do before deciding to implement the solution?", "opts": ["Implement the solution without any further analysis.", "Develop a business case to assess the potential value and feasibility of the solution.", "Ignore the constraints and proceed with the solution.", "Ask for more resources without any justification."], "key": "B", "expl": "A business case is developed to assess the potential value and feasibility of a solution. It considers the constraints, benefits, and risks associated with the solution. In this scenario, the project manager should develop a business case before deciding to implement the solution to ensure it is feasible and will provide value given the resource constraints.Option 2: Implementing a solution without further analysis can lead to wasted resources if the solution is not feasible or does not provide the expected value.Option 3: Ignoring constraints is not a viable option as it can lead to project failure. Constraints should be considered in the decisionmaking process.Option 4: Asking for more resources without any justification is not a good practice. Resources should be allocated based on a thorough analysis and justification.", "dom": "Business Analysis Planning and Monitoring"}, {"q": "A business analyst (BA) will regularly perform stakeholder analysis to understand which of the following?", "opts": ["Changes in business needs", "Attitudes and influence", "Goals and objectives", "Communication channels"], "key": "B", "expl": "Business analysts regularly perform stakeholder analysis to understand the attitudes and influence of stakeholders. This is important for effective stakeholder engagement.", "dom": "Stakeholder"}, {"q": "As a Business Analyst, you are conducting elicitation activities for a new project. What would be your primary objectives during this process according to BABOK® v3?", "opts": ["To create a project plan and allocate resources.", "To gather stakeholder feedback and evaluate the change implementation.", "To explore and discover information relevant to the change.", "To identify risks and develop a risk mitigation strategy."], "key": "C", "expl": "According to BABOK® v3, the primary objectives of conducting elicitation are to explore and discover information relevant to the change. This includes gathering requirements, clarifying uncertainties, and gaining a deep understanding of the business needs. This process is crucial to ensure that the proposed solution aligns with the business objectives and provides the expected value.Option 1: While gathering stakeholder feedback is an important part of the elicitation process, evaluating the change implementation is not the primary objective of elicitation. This task is typically performed during the evaluation phase.Option 2: Identifying risks and developing a risk mitigation strategy is a crucial part of the project management process but it is not the primary objective of the elicitation process in business analysis.Option 4: Creating a project plan and allocating resources are tasks associated with project management, not the primary objectives of the elicitation process in business analysis.", "dom": "Elicitation and Collaboration"}, {"q": "Which business analysis activity ensures that a set of requirements or designs delivers business value and supports the organization's goal andobjectives?", "opts": ["Define requirements architecture", "Define solution options", "Validate requirements", "Verify requirements"], "key": "C", "expl": "The business analysis activity that ensures that a set of requirements or designs delivers business value and supports the organization's goals and objectives is \"Validate requirements.\"", "dom": "Requirements Life Cycle Management"}, {"q": "Which type of requirements are temporary in nature?", "opts": ["Transition requirements", "Stakeholder requirements", "Business requirements", "Solution requirements"], "key": "A", "expl": "Transition requirements are temporary in nature and describe conditions or constraints necessary for transitioning from the current state to the future state. They help manage the change process.", "dom": "Requirements Analysis and Design Definition"}, {"q": "In the define design options task, which of the following relates to the identify improvement opportunities element?", "opts": ["Create flow diagrams, purchase solutions components, secure resources", "Define change strategy, analyze current state, prioritize requirements", "Increase efficiencies, identify additional capabilities, improve access to information", "Assess issues, define risks, confirm elicitation results"], "key": "C", "expl": "In the \"Define design options\" task, the element related to \"identify improvement opportunities\" involves actions to increase efficiencies, identify additional capabilities, and improve access to information.", "dom": "Business Analysis Planning and Monitoring"}, {"q": "The task that uses the elicitation activity plan to draw out, explore and identify information relevant to the change is:", "opts": ["conduct elicitation.", "confirm elicitation results.", "plan business analysis information.", "prepare for elicitation."], "key": "A", "expl": "The task that uses the elicitation activity plan to draw out, explore, and identify information relevant to the change is \"Conduct elicitation.\" This task involves actively engaging with stakeholders to gather information.", "dom": "Elicitation and Collaboration"}, {"q": "What is a definitional rule?", "opts": ["An obligation or prohibition of conduct, action, practice, or procedure", "A representation of the operational knowledge of the organization", "A representation of the behavior of people", "A rule that can be violated"], "key": "A", "expl": "A definitional rule is an obligation or prohibition of conduct, action, practice, or procedure. It defines how something should be done.", "dom": "Understanding Business Analysis"}, {"q": "Business analysis is the practice of enabling change in an enterprise by:", "opts": ["identifying pain points and recommending alternatives.", "defining organizational needs and recommending solutions.", "understanding strategic objectives and improving internal processes.", "listening to stakeholder feedback and documenting their issues."], "key": "B", "expl": "Business analysis involves defining organizational needs and recommending solutions to enable change. It's about identifying what the organization requires and how to achieve it.", "dom": "Understanding Business Analysis"}, {"q": "A project team is working on the development of a new software application. The team has defined various requirements for the application. Among these requirements, some have clearly defined relationships with other requirements and components. What does this imply in the context of Trace Requirements?", "opts": ["These requirements are not clearly defined.", "These requirements are static and are not affected by changes.", "These requirements are traced requirements, having clearly defined relationships to other requirements and components.", "These requirements are independent and have no relation to other elements."], "key": "C", "expl": "In the context of Trace Requirements, the term 'traced requirements' refers to the requirements that have clearly defined relationships to other requirements and components. This means that these requirements are not isolated, but rather they are interconnected with other elements of the system or solution. This interconnection could be in terms of functionality, dependency, or impact. Tracing requirements helps in understanding the ripple effect of changes, in assessing the impact of potential changes, and in maintaining the consistency and integrity of the system or solution as changes occur.Option 1: This option is incorrect because traced requirements are not independent. On the contrary, they have defined relationships with other elements.Option 2: This option is incorrect because traced requirements are not undefined. They are clearly defined and have specific relationships with other elements.Option 4: This option is incorrect because traced requirements are not static. They can be affected by changes, and their relationships with other requirements and components help in understanding and managing the impact of these changes.", "dom": "Requirements Life Cycle Management"}, {"q": "As a business analyst, you are working on a project with multiple stakeholders. The team is facing a problem with decision making and problem solving. What is your primary role to facilitate in this situation?", "opts": ["Facilitate interactions between stakeholders for making decisions and solving problems", "Develop trust among team members", "Motivate people to act in ways that achieve shared goals", "Define, analyze, and communicate business analysis information"], "key": "A", "expl": "The primary role of a business analyst in this situation is to facilitate interactions between stakeholders for making decisions and solving problems. This is crucial to ensure that all stakeholders are aligned and moving towards a common goal. The business analyst acts as a bridge between different stakeholders, helping them to understand each other's perspectives and find a common ground for decision making and problem solving.Option 1: While motivating people to act in ways that achieve shared goals is important, it is not the primary role of a business analyst in this specific situation. This option is incorrect.Option 2: Developing trust among team members is a crucial aspect of team dynamics, but it's not the primary role of a business analyst when it comes to decision making and problem solving. This option is incorrect.Option 4: Defining, analyzing, and communicating business analysis information is a part of the business analyst's role, but in this specific situation, the primary role is to facilitate interactions for decision making and problem solving. This option is incorrect.", "dom": "Elicitation and Collaboration"}, {"q": "What skill is required by a business analyst (BA) to understand how the people, processes, and technology within an organization interact, tounderstand the enterprise from a holistic point of view?", "opts": ["Conceptual thinking", "Systems thinking", "Problem solving", "Creative thinking"], "key": "B", "expl": "Systems thinking is the skill required by a business analyst to understand how the people, processes, and technology within an organization interact and to understand the enterprise from a holistic point of view. This skill is crucial for analyzing complex systems.", "dom": "Understanding Business Analysis"}, {"q": "You are a business analyst in a large enterprise. The company is planning to implement a new software system to streamline its operations. As a business analyst, what would be your primary role in this scenario?", "opts": ["Focus solely on the costbenefit analysis of the new software system", "Define the needs and recommend solutions that deliver value to stakeholders", "Limit the analysis to the current state of the business operations", "Focus only on the strategic initiatives related to the new software system"], "key": "B", "expl": "The primary role of a business analyst in such a scenario would be to define the needs and recommend solutions that deliver value to stakeholders. This involves understanding the requirements of the stakeholders, analyzing the potential value of the solutions, and recommending the most suitable solution. This is in line with the 'Analyze Potential Value and Recommend Solution' task of the 'Requirements Analysis and Design Definition' knowledge area as per BABOK v3 Chapter 7.Option 1: While costbenefit analysis is a part of the business analysis, it is not the primary role of a business analyst. The primary role is to define the needs and recommend solutions that deliver value to stakeholders.Option 3: Limiting the analysis to the current state of business operations would not be sufficient. A business analyst should also consider the future state and how the new software system would affect it.Option 4: While strategic initiatives are important, they are not the primary focus of a business analyst. The primary role is to define the needs and recommend solutions that deliver value to stakeholders.", "dom": "Business Analysis Planning and Monitoring"}, {"q": "Your organization is planning to launch a new website. The business analyst team has been tasked with gathering requirements and designing the solution. Which of the following statements best describes the roles of requirements and designs in this scenario?", "opts": ["Requirements define what the website should look like, while designs outline the technical specifications.", "Requirements focus on the future vision, while designs focus on the current state.", "Requirements outline the technical specifications, while designs define what the website should look like.", "Requirements specify what needs to be done, while designs specify how it will be done."], "key": "D", "expl": "In the context of business analysis, requirements are used to specify what needs to be achieved in this case, the desired features and functionality of the new website. Designs, on the other hand, are used to specify how these requirements will be implemented. This includes the technical specifications, architecture, and other details that will guide the development team in building the website.Option 1: This is incorrect because requirements do not typically include details about the website's appearance. These details are usually part of the design.Option 2: This is incorrect because technical specifications are usually part of the design, not the requirements.Option 4: This is incorrect because both requirements and designs can focus on the future. Requirements outline what needs to be achieved in the future, while designs outline how to achieve it.", "dom": "Requirements Analysis and Design Definition"}, {"q": "Conducting elicitation by asking questions and documenting responses from relevant stakeholders has the following strength:", "opts": ["sharing of information.", "encouraging participation.", "analytical thinking.", "prioritization setting."], "key": "B", "expl": "Conducting elicitation by asking questions and documenting responses from relevant stakeholders encourages participation. It involves stakeholders actively contributing their knowledge and insights.Refer to BABOK: This is supported by BABOK v3, specifically in the Elicitation and Collaboration knowledge area. The \"Conduct Elicitation\" task includes techniques such as interviews and surveys, which directly involve asking questions and documenting responses. Specifically, in BABOK version 3, in the section 5.4 Conduct Elicitation, it explains about interviewing stakeholders and how it encourage participation from those stakeholders.", "dom": "Stakeholder"}, {"q": "What technique is used to elicit business analysis information, including contextual understanding and requirements, by examining availablematerials that describe either the business environment or existing organizational assets?", "opts": ["Organizational modeling", "Data flow diagrams", "Document analysis", "Functional decomposition"], "key": "C", "expl": "Document analysis is the technique used to elicit business analysis information by examining available materials that describe the business environment or existing organizational assets.", "dom": "Understanding Business Analysis"}, {"q": "What are matrices in modelling formats used to describe?", "opts": ["Detailed procedure flow", "Gaps in capability analysis", "Complex but uniform structures", "Hierarchical structure of stakeholders"], "key": "C", "expl": "Matrices in modeling formats are used to describe complex but uniform structures, such as relationships and connections between elements. They help organize and represent relationships in a structured way.", "dom": "Solution"}, {"q": "As a business analyst working on a new software development project, you are tasked with analyzing potential value and recommending solutions. According to BABOK® v3, which of the following behavioral characteristics would be most beneficial to your role in this task?", "opts": ["Personal accountability for the outcomes of your recommendations", "Extensive technical knowledge of software development", "Ability to think creatively and propose innovative solutions", "Ability to perform complex financial calculations"], "key": "A", "expl": "According to BABOK® v3, personal accountability is considered a core competency of behavioral characteristics for business analysts. This means taking responsibility for the outcomes of your actions and decisions, particularly when analyzing potential value and recommending solutions. This is crucial because the recommendations of a business analyst can significantly impact the project's success.Option 1: While financial understanding is important for a business analyst, the ability to perform complex financial calculations is not considered a core competency of behavioral characteristics.Option 2: Technical knowledge is beneficial for a business analyst, but it is not considered a core competency of behavioral characteristics. The focus is more on analytical and problemsolving skills rather than technical expertise.Option 3: Creativity can be beneficial in problemsolving, but it is not considered a core competency of behavioral characteristics for business analysts according to BABOK® v3.", "dom": "Business Analysis and the BA Professional"}, {"q": "During the 'Analyze Potential Value and Recommend Solution' task, an analyst is preparing for elicitation. Which of the following would be the most appropriate use of business objectives in this scenario?", "opts": ["To select the company's next CEO", "To plan and prepare elicitation events, and to develop supporting materials", "To decide on the company's next marketing campaign", "To determine the company's holiday schedule"], "key": "B", "expl": "Business objectives are used in the 'Prepare for Elicitation' process to guide the planning and preparation of elicitation events, and to develop supporting materials. These objectives provide a clear understanding of what the business aims to achieve, which in turn helps to focus the elicitation activities on gathering the most relevant and useful information.Option 2: Determining the company's holiday schedule is not typically a part of the 'Prepare for Elicitation' process. This is usually handled by HR or management, not by business analysts.Option 3: Deciding on the company's next marketing campaign may involve business objectives, but this is not part of the 'Prepare for Elicitation' process. Marketing strategies are typically developed by the marketing department.Option 4: Selecting the company's next CEO is a highlevel decision that is typically made by the board of directors or shareholders, not by business analysts. This is not a part of the 'Prepare for Elicitation' process.", "dom": "Elicitation and Collaboration"}, {"q": "You are a business analyst working for a software company that is considering implementing a new feature. You are using decision analysis to help determine the best course of action. What is NOT a benefit of using decision analysis in this context?", "opts": ["Reducing the risk of making a poor decision about the new feature.", "Improving understanding of the decisionmaking process among the project team.", "Eliminating the need for stakeholder engagement in the decisionmaking process.", "Providing a clear justification for the decision to implement the new feature or not."], "key": "C", "expl": "Using decision analysis in business analysis does not eliminate the need for stakeholder engagement. On the contrary, stakeholder engagement is crucial in the decisionmaking process. It provides valuable input, ensures buyin, and helps avoid potential resistance to the decision. Therefore, while decision analysis can provide a clear justification for decisions, improve understanding of the decisionmaking process, and reduce the risk of making a poor decision, it does not reduce the need for stakeholder engagement.Option 1: This is incorrect because providing a clear justification for decisions is indeed a benefit of using decision analysis.Option 2: This is incorrect because improving understanding of the decisionmaking process among the project team is indeed a benefit of using decision analysis.Option 3: This is incorrect because reducing the risk of making a poor decision is indeed a benefit of using decision analysis.", "dom": "Techniques"}, {"q": "As a business analyst, you are working on a project that involves analyzing the potential value of a proposed solution. You are considering several techniques to facilitate the reuse of requirements. Which of the following techniques is NOT typically used for this purpose?", "opts": ["Data Modelling", "Functional Decomposition", "Business Rules Analysis", "Information Management Approach"], "key": "D", "expl": "The Information Management Approach is not typically used to facilitate the reuse of requirements. This approach is more commonly used to manage information resources, focusing on information access, information privacy, information governance, information quality, and data integration. While it is an important aspect of business analysis, it does not directly contribute to the reuse of requirements.Option Option1: Business Rules Analysis is a technique that can facilitate the reuse of requirements. It involves identifying, expressing, validating, refining, and interacting with business rules to understand an organization's operations.Option Option2: Functional Decomposition is a technique that can facilitate the reuse of requirements. It is a method of analysis that breaks down complex business processes or systems into their simpler, constituent parts.Option Option4: Data Modelling is a technique that can facilitate the reuse of requirements. It involves creating a visual representation of an organization's data and how it is related to other data.", "dom": "Techniques"}, {"q": "What is a valid reason for prioritization?", "opts": ["Requirements which are of significant personal interest to a stakeholder", "Effort and resources needed to implement a requirement", "Development team's advice to implement easy requirements", "Sponsor's wishlist"], "key": "B", "expl": "Prioritization should be based on valid factors like the effort and resources needed to implement a requirement. Prioritization should not be driven by personal interests, wishlists, or ease of implementation.", "dom": "Need"}, {"q": "As a business analyst, you've just finished eliciting requirements from stakeholders for a new software project. You've documented the elicitation results and conducted a confirmation session with the stakeholders. What is the primary outcome of this confirmation session?", "opts": ["The elicitation results are confirmed and agreed upon by stakeholders.", "Stakeholders have a chance to provide additional inputs.", "The elicitation results are discarded and a new elicitation session is scheduled.", "The business analyst identifies potential solutions based on elicitation results."], "key": "A", "expl": "The primary outcome of confirming elicitation results is that the elicitation results are confirmed and agreed upon by stakeholders. This ensures that the requirements are understood and accepted by all involved parties, reducing the likelihood of misunderstandings or disagreements later in the project. This confirmation process is crucial to the success of the project as it ensures that the project is based on accurate and agreedupon requirements.Option 1: While stakeholders may provide additional inputs during the confirmation session, this is not the primary outcome of the session. The main purpose is to confirm the results of the elicitation, not to continue eliciting requirements.Option 3: Although the business analyst may start to identify potential solutions based on the elicitation results, this is not the primary outcome of the confirmation session. The main objective is to confirm and agree on the elicitation results.Option 4: Discarding the elicitation results and scheduling a new elicitation session would only occur if the elicitation results were found to be incorrect or incomplete. This is not the expected outcome of a confirmation session.", "dom": "Elicitation and Collaboration"}, {"q": "When selecting an elicitation technique, the business analyst (BA) should consider techniques that are:", "opts": ["popular in the industry.", "already known by stakeholders.", "easy to use.", "commonly used in similar initiatives."], "key": "D", "expl": "When selecting an elicitation technique, the business analyst should consider techniques that have been commonly used in similar initiatives. This helps leverage previous successful experiences.", "dom": "Techniques"}, {"q": "In a use case, which is one of the two commonly used relationships?", "opts": ["Distribute", "Extend", "Identify", "Inherit"], "key": "B", "expl": "In a use case, one of the two commonly used relationships is \"Extend.\" It represents a way to include optional behavior in a use case that is not part of its primary flow.", "dom": "Techniques"}, {"q": "Which of the following tasks is part of the business analysis planning and monitoring knowledge area?", "opts": ["Analyze current state", "Plan stakeholder engagement", "Trace requirements", "Assess solution limitations"], "key": "B", "expl": "Planning stakeholder engagement is a task within the business analysis planning and monitoring knowledge area. It involves developing plans to engage stakeholders effectively in the business analysis process.", "dom": "Business Analysis Planning and Monitoring"}, {"q": "You are a business analyst working on a new software development project. During the 'Conduct Elicitation' process, you have gathered information from various stakeholders through interviews and workshops. What would be the primary output of this process?", "opts": ["A fully developed software solution", "Elicitation results (unconfirmed)", "Confirmed requirements", "A detailed project plan"], "key": "B", "expl": "The 'Conduct Elicitation' process primarily results in elicitation results, which are unconfirmed information gathered from stakeholders. This information needs to be confirmed and clarified in the subsequent 'Confirm Elicitation Results' process before it becomes 'Confirmed Requirements'.Option 1: A detailed project plan is not the output of the 'Conduct Elicitation' process. It is usually developed during the 'Plan Business Analysis' process.Option 2: A fully developed software solution is the final output of the entire project, not the 'Conduct Elicitation' process.Option 4: Confirmed requirements are not the output of the 'Conduct Elicitation' process. They are the result of the 'Confirm Elicitation Results' process, which follows the 'Conduct Elicitation' process.", "dom": "Elicitation and Collaboration"}, {"q": "As a business analyst in a software development company, you are working on a project that has multiple stakeholders with conflicting requirements. In this context, what would be the key aim of conflict and issue management in the process of approving requirements?", "opts": ["To ensure requirements and designs are supportable within technology standards", "To keep accurate records of current approval status", "To justify investment in a solution", "To maintain stakeholder support for the solution"], "key": "D", "expl": "The key aim of conflict and issue management in the process of approving requirements is to maintain stakeholder support for the solution. This is because conflicts and issues can arise when stakeholders have different views or requirements for the solution. By effectively managing these conflicts and issues, you can ensure that all stakeholders continue to support the solution, which is crucial for the success of the project.Option 2: While ensuring that requirements and designs are supportable within technology standards is important, it is not the key aim of conflict and issue management in the process of approving requirements.Option 3: Justifying investment in a solution is more related to the business case and financial analysis, not directly linked to the conflict and issue management in the process of approving requirements.Option 4: Keeping accurate records of current approval status is a part of requirements management and communication, not the main aim of conflict and issue management.", "dom": "Elicitation and Collaboration"}, {"q": "During the requirements analysis phase of a project at XYZ Corporation, the business analyst is considering potential solutions. According to BABOK® v3, who should the business analyst primarily collaborate with to analyze potential value and recommend a solution?", "opts": ["Tester", "Project Manager", "End User", "Project Sponsor"], "key": "D", "expl": "According to BABOK® v3, during the 'Analyze Potential Value and Recommend Solution' task, the business analyst primarily collaborates with the project sponsor. The sponsor is the one who has the authority to make decisions about the project and its direction, and thus, their input is crucial in analyzing the potential value of a solution and making a recommendation.Option Option2: While the end user's perspective is important in the requirements gathering phase, during the 'Analyze Potential Value and Recommend Solution' task, the business analyst primarily collaborates with the project sponsor, not the end user.Option Option3: The tester's role is important for verifying that the solution meets the requirements and works as expected. However, during the 'Analyze Potential Value and Recommend Solution' task, the business analyst primarily collaborates with the project sponsor.Option Option4: While the project manager is responsible for overseeing the project execution, during the 'Analyze Potential Value and Recommend Solution' task, the business analyst primarily collaborates with the project sponsor, not the project manager.", "dom": "Elicitation and Collaboration"}, {"q": "Which of the following is a guideline or tool, often provided by third parties, used for defining design options?", "opts": ["Solution scope", "Existing solutions", "Traced requirements", "Future state description"], "key": "B", "expl": "Existing solutions are a guideline or tool often provided by third parties that can be used for defining design options. By examining existing solutions, you can identify possible approaches for the current problem.", "dom": "Solution"}, {"q": "As a Business Analyst, you are conducting a review meeting for a proposed solution. Which of the following activities would NOT typically be part of your review process?", "opts": ["Initiating a brainstorming session", "Conducting a technical review", "Organizing a walkthrough", "Performing an inspection"], "key": "A", "expl": "In the context of a review process, the Business Analyst would typically conduct a technical review, perform an inspection, and organize a walkthrough. These activities are all aimed at validating the proposed solution against the requirements and identifying any potential issues or areas for improvement. A brainstorming session, on the other hand, is not typically part of a review process. While brainstorming can be a valuable tool for generating ideas and solutions, it is generally used earlier in the process, during the requirements gathering and solution design stages.Option 1: A technical review is a common part of a review process, where the technical aspects of a proposed solution are closely examined to ensure they meet the requirements and are feasible.Option 2: An inspection is a detailed examination of a product or system, and is typically a part of a review process to ensure the proposed solution meets the requirements.Option 3: A walkthrough is a stepbystep presentation of a proposed solution, often used in a review process to ensure all stakeholders have a clear understanding of the solution and to identify any potential issues or areas for improvement.", "dom": "Requirements Analysis and Design Definition"}, {"q": "In which state should elicitation results be in order to begin modelling of requirements?", "opts": ["Confirmed", "Documented", "Unconfirmed", "Any"], "key": "A", "expl": "Elicitation results should be in a \"Confirmed\" state before beginning the modeling of requirements. This means that the gathered information has been validated and clarified, ensuring its accuracy and consistency.", "dom": "Techniques"}, {"q": "Which of the following tasks is included in the requirements analysis and design definition knowledge area?", "opts": ["Analyze potential value and recommend solution", "Define change strategy", "Assess requirements changes", "Recommend actions to increase solution value"], "key": "A", "expl": "The task of \"Analyzing potential value and recommending a solution\" is included in the \"Requirements Analysis and Design Definition\" knowledge area. This task is about identifying the value of requirements and proposing actions to increase the value.", "dom": "Solution"}, {"q": "In the process of analyzing potential value and recommending a solution, you have identified a requirement that is represented in a general manner. What is the most likely outcome of this requirement during a change?", "opts": ["The requirement is less likely to be revised as it does not reference specific applications or departments.", "The requirement is likely to be revised heavily due to its specific association with a solution.", "The requirement is less likely to be revised due to its general representation.", "The requirement is likely to be revised as it is not intended for reuse."], "key": "C", "expl": "Requirements that are represented in a general manner are less likely to be revised during a change. This is because these requirements are not tied to a specific solution, application, or department, allowing them to be more adaptable to changes in the project or business environment.Option 1: This option is incorrect because requirements that are associated with a specific solution are more likely to be revised during a change as they may not adapt well to new solutions.Option 2: This option is incorrect because the statement is contradictory. A requirement not referencing specific applications or departments would be less likely to be revised, however, this is not the characteristic of the requirement in question.Option 3: This option is incorrect because requirements that are not intended for reuse can still be subject to revisions, especially if they are associated with specific solutions, applications, or departments.", "dom": "Requirements Analysis and Design Definition"}, {"q": "Which of the following techniques would a business analyst (BA) use to conduct elicitation?", "opts": ["Prioritization", "Reviews", "Estimation", "Observation"], "key": "D", "expl": "Observation is one of the techniques used by a business analyst to conduct elicitation. It involves actively observing and documenting activities and interactions to gather information.", "dom": "Elicitation and Collaboration"}];
const LETTERS = ["A","B","C","D"];
const $ = id => document.getElementById(id);
let submitted = false;

function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

$("total1").textContent = QUESTIONS.length;
$("examSub").textContent = QUESTIONS.length + " câu hỏi trắc nghiệm";

/* ---------- Bắt đầu ---------- */
function start(){
  const name = $("name").value.trim();
  if (!name){ $("nameErr").textContent = "Vui lòng nhập họ và tên trước khi làm bài."; $("name").focus(); return; }
  $("nameErr").textContent = "";
  $("who").textContent = name;
  $("start").classList.add("hidden");
  $("quiz").classList.remove("hidden");
  $("dock").classList.remove("hidden");
  build();
  updateProgress();
  window.scrollTo(0,0);
}
$("startBtn").addEventListener("click", start);
$("name").addEventListener("keydown", e => { if (e.key === "Enter") start(); });

/* ---------- Dựng câu hỏi ---------- */
function build(){
  const list = $("list");
  list.textContent = "";
  QUESTIONS.forEach((q, i) => {
    const box = el("article", "q"); box.id = "q" + i;
    const h = el("h2"); h.append(el("span", null, "Câu " + (i+1) + "/" + QUESTIONS.length));
    box.append(h, el("p", "text", q.q));
    const opts = el("div", "opts");
    opts.setAttribute("role", "radiogroup");
    q.opts.forEach((t, k) => {
      const lab = el("label", "opt");
      const inp = document.createElement("input");
      inp.type = "radio"; inp.name = "q" + i; inp.value = LETTERS[k];
      inp.addEventListener("change", updateProgress);
      lab.append(inp, el("span", "k", LETTERS[k] + "."), el("span", null, t));
      opts.append(lab);
    });
    box.append(opts);
    list.append(box);
  });
}

function answerOf(i){
  const c = document.querySelector('input[name="q' + i + '"]:checked');
  return c ? c.value : null;
}
function updateProgress(){
  if (submitted) return;
  let n = 0;
  QUESTIONS.forEach((_, i) => { if (answerOf(i)) n++; });
  $("prog").textContent = "Đã trả lời " + n + "/" + QUESTIONS.length;
}

/* ---------- Giải thích: tách phần chính và phần "Option N:" ---------- */
function splitExplain(txt){
  const parts = txt.split(/\s*Option \d+:\s*/);
  return { main: parts[0].trim(), extra: parts.slice(1).map(s => s.trim()).filter(Boolean) };
}

/* ---------- Nộp bài ---------- */
function submit(){
  if (submitted) return;
  submitted = true;
  let right = 0, wrong = 0, skipped = 0;

  QUESTIONS.forEach((q, i) => {
    const box = $("q" + i);
    const picked = answerOf(i);
    const keyIdx = LETTERS.indexOf(q.key);
    box.classList.add("locked");

    let state;
    if (!picked){ state = "skip"; skipped++; }
    else if (picked === q.key){ state = "ok"; right++; }
    else { state = "bad"; wrong++; }
    box.classList.add("r-" + state);

    box.querySelector("h2").append(el("span", "badge",
      state === "ok" ? "✓ Đúng" : state === "bad" ? "✗ Sai" : "Chưa trả lời"));

    box.querySelectorAll(".opt").forEach((lab, k) => {
      const inp = lab.querySelector("input");
      inp.disabled = true;
      if (k === keyIdx){ lab.classList.add("correct"); lab.append(el("span", "tag", "✓ Đáp án đúng")); }
      else if (LETTERS[k] === picked){ lab.classList.add("wrong"); lab.append(el("span", "tag", "✗ Bạn chọn")); }
    });

    const ex = el("div", "explain");
    ex.append(el("p", "ans", "Đáp án đúng: " + q.key + ". " + q.opts[keyIdx]));
    const s = splitExplain(q.expl);
    if (s.main) ex.append(el("p", null, s.main));
    if (s.extra.length){
      const ul = el("ul");
      s.extra.forEach(t => ul.append(el("li", null, t)));
      ex.append(ul);
    }
    if (q.dom) ex.append(el("div", "domain", "Lĩnh vực: " + q.dom));
    box.append(ex);
  });

  const total = QUESTIONS.length;
  const pct = right / total * 100;
  const pctTxt = (Math.round(pct * 10) / 10).toString().replace(".", ",") + "%";
  const res = $("result");
  res.textContent = "";
  res.append(el("h2", null, "Kết quả của " + $("who").textContent));
  const stats = el("div", "stats");
  [[right + "/" + total, "Số câu đúng"], [pctTxt, "Tỷ lệ câu đúng"], [String(wrong), "Câu sai"], [String(skipped), "Chưa trả lời"]]
    .forEach(([b, s]) => { const d = el("div", "stat"); d.append(el("b", null, b), el("span", null, s)); stats.append(d); });
  const bar = el("div", "bar"); const fill = document.createElement("i"); fill.style.width = pct + "%"; bar.append(fill);
  res.append(stats, bar);
  const again = el("button", "ghost", "Làm lại bài thi"); again.type = "button"; again.style.marginTop = "16px";
  again.addEventListener("click", () => location.reload());
  res.append(again);
  res.classList.remove("hidden");

  $("whoNote").textContent = "Đã nộp bài";
  $("prog").textContent = "Đúng " + right + "/" + total + " (" + pctTxt + ")";
  $("submitBtn").textContent = "Lên đầu trang";
  $("submitBtn").onclick = () => window.scrollTo(0,0);
  window.scrollTo(0,0);
  res.focus({preventScroll:true});
}
$("submitBtn").addEventListener("click", submit);
</script>
</body>
</html>
