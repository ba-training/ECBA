<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECBA Test 3.3</title>
<style>
:root{
  color-scheme: light dark;
  --bg:#f3f6fa; --surface:#ffffff; --ink:#1a2230; --muted:#5b6678; --line:#d9e0ea;
  --brand:#1d4f91; --brand-ink:#ffffff; --brand-soft:#e4edf8;
  --ok:#17703f; --ok-soft:#e1f4e8; --bad:#a82f26; --bad-soft:#fbe6e3; --skip:#7a5a00; --skip-soft:#fbf0d2;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#10151d; --surface:#1a212c; --ink:#e8edf4; --muted:#9aa6b8; --line:#2c3646;
    --brand:#7fb0ee; --brand-ink:#0d1a2b; --brand-soft:#203248;
    --ok:#6fd49a; --ok-soft:#173526; --bad:#ff9a90; --bad-soft:#3d1f1c; --skip:#f0cf72; --skip-soft:#38300f;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 120px}
header.top{background:var(--brand);color:var(--brand-ink);padding:28px 16px;text-align:center}
header.top h1{margin:0;font-size:clamp(1.4rem,4vw,2rem);line-height:1.2;letter-spacing:.2px}
header.top p{margin:6px 0 0;opacity:.85;font-size:.95rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;margin-top:20px}
.hidden{display:none!important}
label.field{display:block;font-weight:600;margin-bottom:8px}
input[type=text]{width:100%;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input[type=text]:focus-visible,button:focus-visible,.opt:has(input:focus-visible){outline:3px solid var(--brand);outline-offset:2px}
.err{color:var(--bad);margin:8px 0 0;min-height:1.4em;font-size:.92rem}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:12px 22px;background:var(--brand);color:var(--brand-ink);cursor:pointer}
button.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand)}
button:hover{filter:brightness(1.08)}
.who{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:.95rem;margin-top:20px}
.who strong{color:var(--ink)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;margin-top:16px;border-left-width:6px}
.q h2{margin:0 0 4px;font-size:.95rem;color:var(--muted);font-weight:600;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.q .text{margin:0 0 14px;font-size:1.05rem;font-weight:600}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--bg)}
.opt:hover{border-color:var(--brand)}
.opt input{margin-top:5px;accent-color:var(--brand)}
.opt .k{font-weight:700;min-width:1.3em}
.opt:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.locked .opt{cursor:default}
.locked .opt:hover{border-color:var(--line)}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt .tag{margin-left:auto;font-size:.85rem;font-weight:700;white-space:nowrap;padding-left:8px}
.opt.correct .tag{color:var(--ok)} .opt.wrong .tag{color:var(--bad)}
.q.r-ok{border-left-color:var(--ok)} .q.r-bad{border-left-color:var(--bad)} .q.r-skip{border-left-color:var(--skip)}
.badge{font-size:.85rem;font-weight:700;padding:2px 10px;border-radius:99px}
.r-ok .badge{background:var(--ok-soft);color:var(--ok)}
.r-bad .badge{background:var(--bad-soft);color:var(--bad)}
.r-skip .badge{background:var(--skip-soft);color:var(--skip)}
.explain{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.explain .ans{margin:0 0 8px;font-weight:700}
.explain p{margin:0 0 8px}
.explain ul{margin:6px 0 0;padding-left:20px;color:var(--muted)}
.explain li{margin-bottom:6px}
.domain{font-size:.85rem;color:var(--muted);margin-top:8px}
.result{border-width:2px;border-color:var(--brand)}
.result h2{margin:0 0 12px;font-size:1.25rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px}
.stat b{display:block;font-size:1.7rem;line-height:1.2}
.stat span{color:var(--muted);font-size:.9rem}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px}
.dock .in{max-width:820px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.dock .prog{color:var(--muted);font-size:.95rem}
.note{color:var(--muted);font-size:.92rem;margin:10px 0 0}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<header class="top">
  <h1 id="examTitle">ECBA Test 3.3</h1>
  <p id="examSub"></p>
</header>

<main class="wrap">
  <section id="start" class="card">
    <label class="field" for="name">Nhập họ và tên của bạn để bắt đầu làm bài</label>
    <input id="name" type="text" autocomplete="name" placeholder="Ví dụ: Nguyễn Văn A" maxlength="80">
    <p class="err" id="nameErr" role="alert"></p>
    <button id="startBtn" type="button">Bắt đầu làm bài</button>
    <p class="note">Bài gồm <span id="total1"></span> câu trắc nghiệm. Bạn có thể nộp bài bất cứ lúc nào; câu chưa trả lời sẽ tính là sai.</p>
  </section>

  <section id="quiz" class="hidden">
    <div class="who"><span>Thí sinh: <strong id="who"></strong></span><span id="whoNote"></span></div>
    <div id="result" class="card result hidden" tabindex="-1"></div>
    <form id="form" onsubmit="return false"><div id="list"></div></form>
  </section>
</main>

<div class="dock hidden" id="dock">
  <div class="in">
    <span class="prog" id="prog"></span>
    <button id="submitBtn" type="button">Nộp bài</button>
  </div>
</div>

<script>
const QUESTIONS = [{"q": "You are a business analyst working on a new software development project. The project team is in the process of defining requirements. You want to ensure that the requirements are sufficiently clear to devise a set of tests. Which technique would be most appropriate to use in this situation?", "opts": ["Stakeholder Analysis", "Requirements Review", "Risk Assessment", "Acceptance and Evaluation Criteria"], "key": "D", "expl": "Acceptance and Evaluation Criteria is the correct answer. This technique is used to define the criteria that will be used to determine whether a solution or solution component meets the requirements. It is particularly useful in ensuring that requirements are clear and testable. The criteria defined can be used as a basis for devising tests.Option 1: Risk Assessment is a technique used to identify and evaluate risks, not to ensure clarity of requirements. While it is an important part of the business analysis process, it would not be the most appropriate technique in this situation.Option 2: Stakeholder Analysis is a technique used to identify stakeholders and understand their needs, interests, and influence. While it is crucial in defining requirements, it does not directly ensure that requirements are clear and testable.Option 3: Requirements Review is a technique used to validate the requirements with stakeholders. It would be used after the requirements have been defined, not to ensure their clarity during the definition process.", "dom": "Techniques"}, {"q": "You are a business analyst working on a software development project. The team is considering several potential solutions to address the identified needs. Which of the following techniques would NOT typically be used in analyzing potential value and recommending a solution?", "opts": ["Document Analysis", "Benchmarking and Market Analysis", "Brainstorming", "Vendor Assessment"], "key": "D", "expl": "In the context of analyzing potential value and recommending a solution, a business analyst would typically use techniques such as benchmarking and market analysis, brainstorming, and document analysis. These techniques can help in understanding the business needs, generating solution options, and evaluating the potential value of these options. However, vendor assessment is typically not used in this context. Vendor assessment is more relevant when the organization is considering purchasing a solution from an external vendor, which is not necessarily the case in every software development project.Option 1: Benchmarking and Market Analysis is a technique that is often used in analyzing potential value and recommending a solution. This technique involves comparing the organization's performance or practices with those of other organizations to identify best practices and potential improvement opportunities.Option 2: Brainstorming is a technique often used in analyzing potential value and recommending a solution. It involves generating a large number of ideas in order to identify a wide range of potential solutions.Option 3: Document Analysis is a technique often used in analyzing potential value and recommending a solution. It involves reviewing existing documentation to gain insights into the business needs and potential solutions.", "dom": "Techniques"}, {"q": "As a business analyst, you are preparing for an elicitation process. Which of the following is the most critical step you should take during the 'Prepare for Elicitation' process?", "opts": ["Understanding the scope of the elicitation activity, selecting appropriate techniques, and planning for necessary resources.", "Jumping directly into the elicitation process without any preparation.", "Analyzing data obtained from the elicitation process.", "Managing the risks associated with the business analysis process."], "key": "A", "expl": "The 'Prepare for Elicitation' process in business analysis primarily involves understanding the scope of the elicitation activity, selecting appropriate techniques, and planning for necessary resources. This step is crucial as it sets the foundation for the entire elicitation process, ensuring that the process is wellstructured and effective.Option 1: Jumping directly into the elicitation process without any preparation is not advisable. Proper planning and preparation are key to ensuring a successful elicitation process.Option 3: While analyzing data obtained from the elicitation process is an important step, it is not the primary objective of the 'Prepare for Elicitation' process.Option 4: Managing the risks associated with the business analysis process is a continuous activity that should be done throughout the business analysis process, not specifically during the 'Prepare for Elicitation' process.", "dom": "Elicitation and Collaboration"}, {"q": "Your team is working on a new software solution for a client. During the validation of requirements, you notice a requirement that seems to be out of the solution scope. Why is it important to evaluate this alignment with the solution scope?", "opts": ["To identify the financial benefits associated with each requirement.", "To ensure that all requirements are beneficial to stakeholders and desirable parts of the solution.", "To guarantee that the requirements deliver the desired business benefits.", "To verify that the requirements are completely understood."], "key": "B", "expl": "The alignment of the requirements with the solution scope is a crucial aspect to ensure that the solution will meet the stakeholders' needs and deliver the expected benefits. If a requirement is not aligned with the solution scope, it may not contribute to the solution's success and can even lead to unnecessary effort and costs. Therefore, it is necessary to evaluate the alignment of each requirement with the solution scope during the validation of requirements to ensure that all requirements are beneficial to stakeholders and desirable parts of the solution.Option 2: Verifying that the requirements are completely understood is important, but it is not directly related to the alignment with the solution scope. A requirement may be well understood and still not be aligned with the solution scope.Option 3: Identifying the financial benefits associated with each requirement can be useful for prioritizing requirements, but it does not directly address the alignment with the solution scope.Option 4: Ensuring that the requirements deliver the desired business benefits is one of the goals of the requirements validation process, but it does not specifically refer to the alignment with the solution scope. A requirement may deliver a business benefit and still not be aligned with the solution scope.", "dom": "Requirements Analysis and Design Definition"}, {"q": "As a Business Analyst, you are working on the data model for a new project. The project team has decided to use a relational database for data storage. Which type of data model would you primarily use to define the detailed structure of the database?", "opts": ["Logical data model", "Aesthetic data model", "Conceptual data model", "Physical data model"], "key": "D", "expl": "A Physical data model is the correct answer. This type of data model is used to define the detailed structure of the database, including tables, fields, data types, constraints, etc. It is specific to the technology that will be used to implement the database. In this case, since a relational database is being used, a physical data model would be the appropriate choice.Option 1: A Conceptual data model is not the correct answer. While this type of model is important in understanding the business requirements and entities, it does not provide the detailed structure needed to implement a database.Option 2: A Logical data model is not the correct answer. This type of model defines the structure of the data elements and their relationships, but it is not specific to any particular technology or database management system. It is more abstract and less detailed than a physical data model.Option 4: An Aesthetic data model is not a recognized type of data modeling in business analysis and therefore is not the correct answer.", "dom": "Techniques"}, {"q": "A Business Analyst is working on a project to improve the efficiency of the organization's customer service department. They have identified the problem and are now considering potential solutions. Which of the following activities is the Business Analyst likely to perform next?", "opts": ["Analyze the impact of changes on the system as a whole", "Define the nature of the problem again", "Present the problem to stakeholders without considering any solutions", "Identify the best ways to present information to stakeholders"], "key": "A", "expl": "The correct answer is Option 2. After identifying a problem and considering potential solutions, the Business Analyst's next step would typically be to analyze the impact of these potential solutions on the system as a whole. This analysis would help the Business Analyst to understand the potential implications of each solution, and to make an informed recommendation about the best course of action.Option 1: Option 1 is incorrect. While presenting the problem to stakeholders is an important part of the problemsolving process, the Business Analyst would typically consider potential solutions before doing so. This allows the Business Analyst to provide stakeholders with a more complete understanding of the situation, and to suggest possible ways forward.Option 3: Option 3 is incorrect. The Business Analyst has already defined the nature of the problem. Redefining the problem at this stage would not be a productive use of time, and would not move the problemsolving process forward.Option 4: Option 4 is incorrect. Identifying the best ways to present information to stakeholders is an important part of the Business Analyst's role. However, this would typically occur after the Business Analyst has analyzed the impact of potential solutions on the system as a whole.", "dom": "Requirements Analysis and Design Definition"}, {"q": "A business analyst is working on a complex project involving multiple stakeholders and various requirements. Why would the analyst use diagrams in the context of requirements modeling?", "opts": ["To visually represent a requirement or set of requirements, especially when depicting complexity.", "To record details about the data involved in the change.", "To record the meaning of relevant business terms.", "To define and analyze the quality of service attributes."], "key": "A", "expl": "The main purpose of using diagrams in the context of requirements modeling is to visually represent a requirement or set of requirements. This is particularly beneficial when dealing with complex projects that involve multiple stakeholders and various requirements. Diagrams can help to simplify the complexity and provide a clear, visual representation of the requirements. This can enhance understanding among stakeholders and facilitate more effective communication and collaboration.Option 2: While recording the meaning of relevant business terms is an important aspect of business analysis, it is not the main purpose of using diagrams in requirements modeling. Diagrams are primarily used to visually represent requirements, particularly in complex scenarios.Option 3: Defining and analyzing the quality of service attributes is a crucial part of business analysis, but it is not the primary reason for using diagrams in requirements modeling. Diagrams are used to visually depict requirements, which can be particularly beneficial in complex situations.Option 4: Recording details about the data involved in the change is an important part of requirements modeling, but it is not the main reason for using diagrams. Diagrams are primarily used to provide a visual representation of requirements, especially in complex scenarios.", "dom": "Techniques"}, {"q": "You are working as a business analyst for a software development company. The company is planning to develop a new software product and you are assigned to gather and analyze the requirements. In order to ensure proper maintenance, how should the requirements be?", "opts": ["Stored in a specialized database that only the business analyst can access", "Clearly named and defined, and easily available to stakeholders", "Complex and sophisticated, and tied to a specific tool or organizational structure", "Reviewed and approved by all stakeholders"], "key": "B", "expl": "For proper maintenance, it is crucial that requirements are clearly named and defined, and easily available to stakeholders. Clear and welldefined requirements ensure that all stakeholders have a shared understanding of what is required. Furthermore, making requirements easily available to stakeholders facilitates communication and collaboration, which are key to successful requirement management.Option 1: Storing requirements in a specialized database that only the business analyst can access can create bottlenecks and hinder communication and collaboration. It is important that all stakeholders have easy access to requirements.Option 2: Making requirements complex and tying them to a specific tool or organizational structure can make it difficult for stakeholders to understand and work with the requirements. This can lead to misinterpretations and errors.Option 3: While it is important to have requirements reviewed and approved by stakeholders, this alone is not sufficient for proper maintenance. Requirements also need to be clearly named and defined, and easily accessible to stakeholders.", "dom": "Requirements Life Cycle Management"}, {"q": "You are a business analyst working on a new software development project. The project manager asks you to define the requirements architecture. What is your primary purpose in doing so?", "opts": ["To define the individual models and specifications", "To identify the relationships among models", "To demonstrate the traceability of the requirements", "To ensure that the requirements collectively support one another to fully achieve the objectives"], "key": "D", "expl": "Defining requirements architecture is primarily done to ensure that the requirements collectively support one another to fully achieve the objectives. This involves organizing and structuring the requirements in a way that they align with the business objectives and goals. It also includes ensuring that the requirements are feasible, verifiable, and capable of meeting the stakeholders' needs and expectations.Option 1: While demonstrating the traceability of the requirements is an important aspect of business analysis, it is not the primary purpose of defining requirements architecture. Traceability is more about tracking the requirements throughout the project lifecycle to ensure they are being met.Option 3: Defining the individual models and specifications is part of the process of defining requirements, but it is not the primary purpose of defining requirements architecture. The architecture is more about how the requirements interact and support each other to achieve the business objectives.Option 4: Identifying the relationships among models can be part of the process of defining requirements architecture, but it is not the primary purpose. The main goal is to ensure that the requirements collectively support the business objectives.", "dom": "Requirements Analysis and Design Definition"}, {"q": "During the requirements analysis phase of a project, a change is proposed that could significantly alter the project's scope. Who would be the most appropriate stakeholder to provide feedback on the potential impact this change could have on value?", "opts": ["Quality Assurance Analyst", "Customer", "Regulator", "Project Sponsor"], "key": "B", "expl": "The correct answer is the Customer. In the context of requirements analysis and design definition, the customer is the primary stakeholder who can provide feedback on the potential impact a change could have on value. This is because the customer is the one who ultimately derives value from the solution. They have the best understanding of their needs and are in the best position to assess whether a proposed change would enhance or detract from the value they expect to receive.Option 1: A Quality Assurance Analyst, while important in ensuring that the solution meets quality standards, does not typically have the authority or the perspective to assess the impact of changes on value.Option 2: The Project Sponsor, while a key stakeholder, may not have the detailed understanding of the customer's needs to accurately assess the impact of a proposed change on value. Their primary role is to provide direction and resources for the project.Option 4: A Regulator is concerned with ensuring that the project complies with relevant laws and regulations. They do not typically provide feedback on the impact of changes on value.", "dom": "Elicitation and Collaboration"}, {"q": "A solution is considered to be successful when the:", "opts": ["Business need is satisfied.", "Performance evaluation is positive.", "Organization is ready to accept it.", "Stakeholder's expectations are met."], "key": "A", "expl": "According to BABOK (Chapter 7: Solution Evaluation), a solution is considered successful when it meets the business need it was designed to address. While stakeholder expectations, organizational readiness, and performance evaluation are important, the ultimate measure of success is whether the solution effectively solves the identified business problem or opportunity.", "dom": "BA Key Concepts"}, {"q": "What are the dependencies that could potentially shift the priority order of requirements?", "opts": ["Dependencies on the number of requirements.", "Dependencies on stakeholders' personal preferences.", "Dependencies on the initial cost estimates.", "Dependencies related to relationships between requirements where one requirement cannot be fulfilled unless the other is fulfilled."], "key": "D", "expl": "Dependencies that can influence the prioritization of requirements are typically related to relationships between the requirements themselves. If one requirement cannot be fulfilled unless the other is fulfilled, it establishes a dependency between the two. This could influence which requirement is prioritized over the other.BABOK v3 Chapter 5.3.4", "dom": "Stakeholder"}, {"q": "Your team has been given a project to develop a new software system for a client. The client has provided numerous documents detailing their current processes, systems, and business rules. As a business analyst, which technique would you use to review these documents in order to identify business rules, requirements, or other information that may be useful for the project?", "opts": ["Backlog Management", "Document Analysis", "Benchmarking and Market Analysis", "Balanced Scorecard"], "key": "B", "expl": "Document Analysis is the correct answer. This technique is used to elicit requirements by analyzing existing documentation and identifying relevant information. It can be used to understand the current state of the system, identify business rules and processes, and derive requirements for the new system.Option 1: Balanced Scorecard is not the correct answer. This technique is generally used for strategic planning and performance management, not for reviewing documents to identify requirements.Option 2: Benchmarking and Market Analysis is not the correct answer. This technique is used to compare an organization's performance or practices with those of other organizations or industry standards, not for reviewing documents to identify requirements.Option 4: Backlog Management is not the correct answer. This technique is used in agile methodologies to prioritize and manage work items, not for reviewing documents to identify requirements.", "dom": "Techniques"}, {"q": "Which type of stakeholder is responsible for initiating the effort to define a business need?", "opts": ["Project manager", "Regulator", "Sponsor", "Business analyst"], "key": "C", "expl": "Sponsors are typically responsible for initiating the effort to define a business need. They often provide the necessary support and resources for a project or initiative.", "dom": "Need"}, {"q": "Why is it necessary to continuously reprioritize requirements?", "opts": ["To adhere to regulatory constraints.", "To account for changes in stakeholder preferences.", "To adjust to shifting contexts and new information.", "To ensure that the project stays within the budget."], "key": "C", "expl": "Continuous reprioritization of requirements is crucial because priorities may shift as the context evolves and new information becomes available. Initial prioritization is done at a high level, and as the requirements are refined, prioritization becomes more granular, incorporating new bases for prioritization as appropriate. The basis for prioritization may differ at various stages of the project.BABOK v3 Chapter 5.3.4", "dom": "Change"}];
const LETTERS = ["A","B","C","D"];
const $ = id => document.getElementById(id);
let submitted = false;

function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

$("total1").textContent = QUESTIONS.length;
$("examSub").textContent = QUESTIONS.length + " câu hỏi trắc nghiệm";

/* ---------- Bắt đầu ---------- */
function start(){
  const name = $("name").value.trim();
  if (!name){ $("nameErr").textContent = "Vui lòng nhập họ và tên trước khi làm bài."; $("name").focus(); return; }
  $("nameErr").textContent = "";
  $("who").textContent = name;
  $("start").classList.add("hidden");
  $("quiz").classList.remove("hidden");
  $("dock").classList.remove("hidden");
  build();
  updateProgress();
  window.scrollTo(0,0);
}
$("startBtn").addEventListener("click", start);
$("name").addEventListener("keydown", e => { if (e.key === "Enter") start(); });

/* ---------- Dựng câu hỏi ---------- */
function build(){
  const list = $("list");
  list.textContent = "";
  QUESTIONS.forEach((q, i) => {
    const box = el("article", "q"); box.id = "q" + i;
    const h = el("h2"); h.append(el("span", null, "Câu " + (i+1) + "/" + QUESTIONS.length));
    box.append(h, el("p", "text", q.q));
    const opts = el("div", "opts");
    opts.setAttribute("role", "radiogroup");
    q.opts.forEach((t, k) => {
      const lab = el("label", "opt");
      const inp = document.createElement("input");
      inp.type = "radio"; inp.name = "q" + i; inp.value = LETTERS[k];
      inp.addEventListener("change", updateProgress);
      lab.append(inp, el("span", "k", LETTERS[k] + "."), el("span", null, t));
      opts.append(lab);
    });
    box.append(opts);
    list.append(box);
  });
}

function answerOf(i){
  const c = document.querySelector('input[name="q' + i + '"]:checked');
  return c ? c.value : null;
}
function updateProgress(){
  if (submitted) return;
  let n = 0;
  QUESTIONS.forEach((_, i) => { if (answerOf(i)) n++; });
  $("prog").textContent = "Đã trả lời " + n + "/" + QUESTIONS.length;
}

/* ---------- Giải thích: tách phần chính và phần "Option N:" ---------- */
function splitExplain(txt){
  const parts = txt.split(/\s*Option \d+:\s*/);
  return { main: parts[0].trim(), extra: parts.slice(1).map(s => s.trim()).filter(Boolean) };
}

/* ---------- Nộp bài ---------- */
function submit(){
  if (submitted) return;
  submitted = true;
  let right = 0, wrong = 0, skipped = 0;

  QUESTIONS.forEach((q, i) => {
    const box = $("q" + i);
    const picked = answerOf(i);
    const keyIdx = LETTERS.indexOf(q.key);
    box.classList.add("locked");

    let state;
    if (!picked){ state = "skip"; skipped++; }
    else if (picked === q.key){ state = "ok"; right++; }
    else { state = "bad"; wrong++; }
    box.classList.add("r-" + state);

    box.querySelector("h2").append(el("span", "badge",
      state === "ok" ? "✓ Đúng" : state === "bad" ? "✗ Sai" : "Chưa trả lời"));

    box.querySelectorAll(".opt").forEach((lab, k) => {
      const inp = lab.querySelector("input");
      inp.disabled = true;
      if (k === keyIdx){ lab.classList.add("correct"); lab.append(el("span", "tag", "✓ Đáp án đúng")); }
      else if (LETTERS[k] === picked){ lab.classList.add("wrong"); lab.append(el("span", "tag", "✗ Bạn chọn")); }
    });

    const ex = el("div", "explain");
    ex.append(el("p", "ans", "Đáp án đúng: " + q.key + ". " + q.opts[keyIdx]));
    const s = splitExplain(q.expl);
    if (s.main) ex.append(el("p", null, s.main));
    if (s.extra.length){
      const ul = el("ul");
      s.extra.forEach(t => ul.append(el("li", null, t)));
      ex.append(ul);
    }
    if (q.dom) ex.append(el("div", "domain", "Lĩnh vực: " + q.dom));
    box.append(ex);
  });

  const total = QUESTIONS.length;
  const pct = right / total * 100;
  const pctTxt = (Math.round(pct * 10) / 10).toString().replace(".", ",") + "%";
  const res = $("result");
  res.textContent = "";
  res.append(el("h2", null, "Kết quả của " + $("who").textContent));
  const stats = el("div", "stats");
  [[right + "/" + total, "Số câu đúng"], [pctTxt, "Tỷ lệ câu đúng"], [String(wrong), "Câu sai"], [String(skipped), "Chưa trả lời"]]
    .forEach(([b, s]) => { const d = el("div", "stat"); d.append(el("b", null, b), el("span", null, s)); stats.append(d); });
  const bar = el("div", "bar"); const fill = document.createElement("i"); fill.style.width = pct + "%"; bar.append(fill);
  res.append(stats, bar);
  const again = el("button", "ghost", "Làm lại bài thi"); again.type = "button"; again.style.marginTop = "16px";
  again.addEventListener("click", () => location.reload());
  res.append(again);
  res.classList.remove("hidden");

  $("whoNote").textContent = "Đã nộp bài";
  $("prog").textContent = "Đúng " + right + "/" + total + " (" + pctTxt + ")";
  $("submitBtn").textContent = "Lên đầu trang";
  $("submitBtn").onclick = () => window.scrollTo(0,0);
  window.scrollTo(0,0);
  res.focus({preventScroll:true});
}
$("submitBtn").addEventListener("click", submit);
</script>
</body>
</html>
