<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECBA Test 3 Weekend</title>
<style>
:root{
  color-scheme: light dark;
  --bg:#f3f6fa; --surface:#ffffff; --ink:#1a2230; --muted:#5b6678; --line:#d9e0ea;
  --brand:#1d4f91; --brand-ink:#ffffff; --brand-soft:#e4edf8;
  --ok:#17703f; --ok-soft:#e1f4e8; --bad:#a82f26; --bad-soft:#fbe6e3; --skip:#7a5a00; --skip-soft:#fbf0d2;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#10151d; --surface:#1a212c; --ink:#e8edf4; --muted:#9aa6b8; --line:#2c3646;
    --brand:#7fb0ee; --brand-ink:#0d1a2b; --brand-soft:#203248;
    --ok:#6fd49a; --ok-soft:#173526; --bad:#ff9a90; --bad-soft:#3d1f1c; --skip:#f0cf72; --skip-soft:#38300f;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 120px}
header.top{background:var(--brand);color:var(--brand-ink);padding:28px 16px;text-align:center}
header.top h1{margin:0;font-size:clamp(1.4rem,4vw,2rem);line-height:1.2;letter-spacing:.2px}
header.top p{margin:6px 0 0;opacity:.85;font-size:.95rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;margin-top:20px}
.hidden{display:none!important}
label.field{display:block;font-weight:600;margin-bottom:8px}
input[type=text]{width:100%;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input[type=text]:focus-visible,button:focus-visible,.opt:has(input:focus-visible){outline:3px solid var(--brand);outline-offset:2px}
.err{color:var(--bad);margin:8px 0 0;min-height:1.4em;font-size:.92rem}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:12px 22px;background:var(--brand);color:var(--brand-ink);cursor:pointer}
button.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand)}
button:hover{filter:brightness(1.08)}
.who{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:.95rem;margin-top:20px}
.who strong{color:var(--ink)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;margin-top:16px;border-left-width:6px}
.q h2{margin:0 0 4px;font-size:.95rem;color:var(--muted);font-weight:600;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.q .text{margin:0 0 14px;font-size:1.05rem;font-weight:600}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--bg)}
.opt:hover{border-color:var(--brand)}
.opt input{margin-top:5px;accent-color:var(--brand)}
.opt .k{font-weight:700;min-width:1.3em}
.opt:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.locked .opt{cursor:default}
.locked .opt:hover{border-color:var(--line)}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt .tag{margin-left:auto;font-size:.85rem;font-weight:700;white-space:nowrap;padding-left:8px}
.opt.correct .tag{color:var(--ok)} .opt.wrong .tag{color:var(--bad)}
.q.r-ok{border-left-color:var(--ok)} .q.r-bad{border-left-color:var(--bad)} .q.r-skip{border-left-color:var(--skip)}
.badge{font-size:.85rem;font-weight:700;padding:2px 10px;border-radius:99px}
.r-ok .badge{background:var(--ok-soft);color:var(--ok)}
.r-bad .badge{background:var(--bad-soft);color:var(--bad)}
.r-skip .badge{background:var(--skip-soft);color:var(--skip)}
.explain{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.explain .ans{margin:0 0 8px;font-weight:700}
.explain p{margin:0 0 8px}
.explain ul{margin:6px 0 0;padding-left:20px;color:var(--muted)}
.explain li{margin-bottom:6px}
.domain{font-size:.85rem;color:var(--muted);margin-top:8px}
.result{border-width:2px;border-color:var(--brand)}
.result h2{margin:0 0 12px;font-size:1.25rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px}
.stat b{display:block;font-size:1.7rem;line-height:1.2}
.stat span{color:var(--muted);font-size:.9rem}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px}
.dock .in{max-width:820px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.dock .prog{color:var(--muted);font-size:.95rem}
.note{color:var(--muted);font-size:.92rem;margin:10px 0 0}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<header class="top">
  <h1 id="examTitle">ECBA Test 3 Weekend</h1>
  <p id="examSub"></p>
</header>

<main class="wrap">
  <section id="start" class="card">
    <label class="field" for="name">Nhập họ và tên của bạn để bắt đầu làm bài</label>
    <input id="name" type="text" autocomplete="name" placeholder="Ví dụ: Nguyễn Văn A" maxlength="80">
    <p class="err" id="nameErr" role="alert"></p>
    <button id="startBtn" type="button">Bắt đầu làm bài</button>
    <p class="note">Bài gồm <span id="total1"></span> câu trắc nghiệm. Bạn có thể nộp bài bất cứ lúc nào; câu chưa trả lời sẽ tính là sai.</p>
  </section>

  <section id="quiz" class="hidden">
    <div class="who"><span>Thí sinh: <strong id="who"></strong></span><span id="whoNote"></span></div>
    <div id="result" class="card result hidden" tabindex="-1"></div>
    <form id="form" onsubmit="return false"><div id="list"></div></form>
  </section>
</main>

<div class="dock hidden" id="dock">
  <div class="in">
    <span class="prog" id="prog"></span>
    <button id="submitBtn" type="button">Nộp bài</button>
  </div>
</div>

<script>
const QUESTIONS = [{"q": "What role does the identification of assumptions play in the process of validating requirements?", "opts": ["To define associated risks that can be managed", "To highlight them as a key requirement", "To ignore them during the project", "To communicate them to the competitors"], "key": "A", "expl": "BABOK® v3 describes the purpose of identifying assumptions within the Validate Requirements process. This is done in order to define any associated risks, which can then be managed appropriately. Ignoring the assumptions (Option A. or communicating them to competitors (Option D. are not mentioned in BABOK® v3 and are not correct approaches. Highlighting them as a key requirement (Option C. could be misleading, as an assumption isn't necessarily a requirement, but rather an understanding or prediction that should be scrutinized for possible risks.BABOK v3 Chapter 7.3.4", "dom": "Solution"}, {"q": "What is Impact Analysis in the context of assessing requirements changes?", "opts": ["It is performed to assess or evaluate the effect of a change.", "It is used to understand the social implications of a change in requirements.", "It is a method for determining the financial consequences of a proposed change.", "It is a process of evaluating the effectiveness of a solution."], "key": "A", "expl": "According to the \"5.4.4 Elements\" section of BABOK® v3, Impact Analysis is performed to assess or evaluate the effect of a change. It involves reviewing the relationships between changing requirements and other requirements or solution components. The other options do not accurately describe the process of Impact Analysis as mentioned in BABOK® v3.BABOK v3 Chapter 5.4.4", "dom": "Requirements Life Cycle Management"}, {"q": "In predictive approaches, who typically has the responsibility to approve requirements and designs?", "opts": ["Customers", "Business analysts", "Regulators", "Key stakeholders"], "key": "D", "expl": "According to BABOK® v3, business analysts communicate requirements, designs, and other business analysis information to the key stakeholders, who are responsible for approving that information. This is true regardless of whether the approval process is formal or informal. In predictive approaches, these approvals typically occur at the end of a phase or during planned change control meetings.BABOK v3 Chapter 5.5.2", "dom": "Requirements Life Cycle Management"}, {"q": "If a business analyst (BA) asks questions during the job shadowing with a subject matter expert, which approach is being used?", "opts": ["Contextual Inquiry Observation", "Passive Observation Approach", "Active Observation Approach", "Inactive Observation Approach"], "key": "C", "expl": "When a business analyst asks questions during job shadowing with a subject matter expert, they are using an active observation approach. This approach involves active engagement and seeking clarifications.", "dom": "Elicitation and Collaboration"}, {"q": "Which action would a business analyst (BA) propose to improve the operation of the business?", "opts": ["Outsource the operation team", "Shadow the expert staff", "Simplify the work people perform", "Assist in the daily activities"], "key": "C", "expl": "Business analysts often propose simplifying work processes to improve business operations. This involves identifying and eliminating unnecessary complexities.", "dom": "Business Analysis and the BA Professional"}, {"q": "In addition to schedule, which other factor must be considered when evaluating changes to requirements?", "opts": ["Agreement by executive board members", "Number of customers and endusers affected", "Capacity of the requirements management tool", "Amount of time needed to create new documents"], "key": "B", "expl": "When evaluating changes to requirements, the number of customers and endusers affected is an important factor to consider.", "dom": "Requirements Life Cycle Management"}, {"q": "Which input is used to prepare for elicitation?", "opts": ["Activity plan", "Change strategy", "Stakeholder engagement approach", "Business analysis information"], "key": "C", "expl": "The stakeholder engagement approach is used to prepare for elicitation. It outlines how stakeholders will be involved and engaged in the elicitation process.", "dom": "Stakeholder"}, {"q": "Imagine you are a business analyst working on a project to develop a new ecommerce platform for a retail company. You have just completed the elicitation process and are beginning to develop specifications and models. During this process, you uncover some inconsistencies in the elicitation results. When are these inconsistencies most likely to have been uncovered?", "opts": ["When business analysts develop specifications and models", "During followup meetings with stakeholders", "When historical data is compared to recent results", "When stakeholders independently confirm the results"], "key": "A", "expl": "The correct answer is option 4. During the process of developing specifications and models, business analysts often uncover inconsistencies in the elicitation results. This is because this process involves a detailed examination of the information gathered during elicitation, which can reveal discrepancies that were not apparent at the time the information was collected.Option 1: Option 1 is incorrect because although followup meetings with stakeholders can reveal some inconsistencies, these are typically uncovered earlier in the process, during the elicitation process itself.Option 2: Option 2 is incorrect because comparing historical data to recent results is not typically a part of the business analyst's role and would not likely reveal inconsistencies in the elicitation results.Option 3: Option 3 is incorrect because stakeholders independently confirming the results is not a standard part of the elicitation process, and would not likely reveal inconsistencies in the elicitation results.", "dom": "Elicitation and Collaboration"}, {"q": "You are a business analyst working on a project that requires elicitation activities. You have to consider various factors to guide and facilitate these activities. Which of the following sets of factors should be your primary concern?", "opts": ["Elicitation activity goals, stakeholder roles, and project timeline", "Elicitation activity agenda, process improvement strategies, and communication plan", "Elicitation activity goals, scope of change, and integration of output", "Elicitation activity logistics, available resources, and stakeholder feedback"], "key": "C", "expl": "The correct answer is Option 4. Elicitation activity goals are essential as they define what needs to be achieved. The scope of change refers to the extent of modifications required in the current business process or system. It helps in understanding the depth of elicitation needed. Integration of output ensures that the elicited requirements are consistent with other project deliverables and can be integrated smoothly into the overall project plan.Option 1: Option 1 is incorrect because while stakeholder roles and project timeline are important considerations, they do not directly guide the elicitation activities.Option 2: Option 2 is incorrect because logistics and available resources, while important, are secondary to the goals, scope, and integration of output.Option 3: Option 3 is incorrect because while the agenda and communication plan are important, they are not the primary factors guiding the elicitation activities.", "dom": "Elicitation and Collaboration"}, {"q": "In a project to develop a new customer relationship management system, a business analyst has identified several potential solutions. Who is primarily responsible for analyzing the potential value of these solutions and making a recommendation to stakeholders?", "opts": ["The Sponsor", "The Regulator", "The Project Manager", "The Business Analyst"], "key": "D", "expl": "According to the BABOK v3 Chapter 7's 'Analyze Potential Value and Recommend Solution' section, the Business Analyst is primarily responsible for analyzing the potential value of solutions and making a recommendation to stakeholders. They must understand the needs and concerns of stakeholders and use this understanding to evaluate potential solutions and make a recommendation that aligns with the project's objectives and stakeholders' expectations.Option 1: The Project Manager is responsible for overseeing the project and ensuring it is completed on time and within budget. They may be involved in evaluating solutions, but the primary responsibility for this task lies with the Business Analyst.Option 2: The Regulator's role is to ensure that the project complies with relevant laws and regulations. They do not typically play a role in evaluating potential solutions or making recommendations to stakeholders.Option 3: The Sponsor is typically a senior executive who champions the project within the organization. They may have input into the evaluation of potential solutions, but the primary responsibility for this task lies with the Business Analyst.", "dom": "Business Analysis and the BA Professional"}, {"q": "Which of the following best describes the 'Depends' relationship in the context of requirements traceability?", "opts": ["It is a relationship between two requirements used when a requirement depends on another requirement.", "It is a relationship between a requirement and a test case or other element that can determine whether a solution fulfills the requirement.", "It is a relationship between a functional requirement and a solution component that is implementing it.", "It is a relationship between two requirements used when a requirement is derived from another requirement."], "key": "A", "expl": "In the context of requirements traceability, 'Depends' is a relationship between two requirements used when a requirement depends on another requirement (Section 5.1.4).Options A and B describe the 'Satisfy' and 'Validate' relationships, respectively, while option C describes the 'Derive' relationship, not the 'Depends' relationship.BABOK v3 Chapter 5.1.4", "dom": "Requirements Life Cycle Management"}, {"q": "What are the underlying competencies of business knowledge?", "opts": ["Solution Knowledge, Methodology Knowledge, Industry Knowledge", "Business Acumen, Solution Knowledge, Methodology Knowledge", "Business Acumen, Industry Knowledge, Organization Knowledge", "Industry Knowledge, Organization Knowledge, Solution Knowledge"], "key": "C", "expl": "BABOK® v3 mentions that the underlying competencies of business knowledge include Business Acumen, Industry Knowledge, and Organization Knowledge. These competencies enable the business analyst to better understand the structure, benefits, and value of a situation as it relates to a change or a need.Therefore, option c is the correct response.BABOK v3 Chapter 9.3", "dom": "Underlying Competencies"}, {"q": "A focus group is a form of which type of research?", "opts": ["Statistical", "Theoretical", "Quantitative", "Qualitative"], "key": "D", "expl": "A focus group is a qualitative research method where a small group of people are brought together to discuss a topic or product. It is used to gather indepth information and insights from participants, making it a form of qualitative research.", "dom": "Mindset for Effective Business Analysis"}, {"q": "What does the solution scope ensure during the requirements validation process?", "opts": ["It ensures the financial benefits associated with requirements.", "It ensures that the requirements that provide benefit are within the scope of the desired solution.", "It ensures that the requirements deliver the desired business benefits.", "It ensures the tracking of any problems or issues identified during validation."], "key": "B", "expl": "The solution scope in the requirements validation process ensures that the requirements which provide benefits align with the scope of the desired solution. It does not directly ensure the delivery of business benefits, financial benefits, or tracking of problems/issues which are addressed by different components of the process.Hence, options A, C, and D are incorrect.BABOK v3 Chapter 7.3", "dom": "Solution"}, {"q": "What task is performed to ensure that all requirements align to the business need?", "opts": ["Validate Requirements", "Model Requirements", "Define Requirements", "Prioritize Requirements"], "key": "A", "expl": "Validating requirements is the task performed to ensure that all requirements align with the business need and that they are accurate, complete, and relevant.", "dom": "Implementing Business Analysis"}, {"q": "You are a business analyst working for a software company that is developing a new product. Stakeholders have been identified and analyzed. What is your next step in terms of managing stakeholder collaboration according to BABOKÂ® v3?", "opts": ["Wait until a major change occurs within the organization.", "Start managing stakeholder collaboration before the stakeholders are identified.", "Start managing stakeholder collaboration immediately.", "Wait until the business analyst deems it necessary."], "key": "C", "expl": "According to BABOK v3, managing stakeholder collaboration begins once stakeholders have been identified and analyzed. It's important to begin this process immediately in order to ensure that all stakeholders are engaged and that their needs and concerns are being addressed throughout the project.Option 1: Waiting for a major change within the organization is not a requirement for managing stakeholder collaboration. This process should begin as soon as stakeholders have been identified and analyzed.Option 3: It is not up to the business analyst to decide when to begin managing stakeholder collaboration. According to BABOK v3, this process should begin once stakeholders have been identified and analyzed.Option 4: Managing stakeholder collaboration cannot begin before stakeholders are identified. It's necessary to know who the stakeholders are in order to effectively manage collaboration.", "dom": "Elicitation and Collaboration"}, {"q": "Which activity is a business analyst (BA) performing when ensuring that a set of requirements is developed with enough detail to be usable by a particular stakeholder?", "opts": ["Eliciting requirements", "Validating requirements", "Specifying requirements", "Verifying requirements"], "key": "C", "expl": "Specifying requirements involves documenting and refining requirements in sufficient detail so that they are clear, precise, and usable by stakeholders such as developers, testers, and business teams. This ensures that the requirements are welldefined, structured, and actionable for implementation.", "dom": "Requirements Analysis and Design Definition"}, {"q": "You are a business analyst working on a project. The project's stakeholders have identified a requirement for the system to be able to handle 10,000 concurrent users. However, due to some changes in the project's circumstances, the stakeholders have not changed the requirement but have altered some of its attributes. Which of the following attributes of the requirement could have been changed?", "opts": ["The requirement's priority", "All of these", "The requirement's complexity", "The requirement's source"], "key": "B", "expl": "The correct answer is 'All of these'. Even though the requirement itself has not changed, its attributes can still be modified. The source of the requirement could change if, for example, a different stakeholder becomes responsible for it. The requirement's priority could be altered based on the project's needs and circumstances. For instance, if the project's timeline or budget changes, the requirement's priority could be adjusted accordingly. The requirement's complexity could also be changed. This could happen if, for example, new information about the requirement becomes available, causing the team to realize that it is more complex than they initially thought.Option 1: The requirement's source could change, but it is not the only attribute that could be altered. Therefore, this answer is incorrect.Option 2: The requirement's priority could change, but it is not the only attribute that could be altered. Therefore, this answer is incorrect.Option 3: The requirement's complexity could change, but it is not the only attribute that could be altered. Therefore, this answer is incorrect.", "dom": "Requirements Analysis and Design Definition"}, {"q": "Which of the following is an activity that a business analyst (BA) performs to prepare for elicitation?", "opts": ["Analyze performance measures", "Secure supporting material", "Assess risk", "Trace requirements"], "key": "B", "expl": "Securing supporting material is an activity that a business analyst performs to prepare for elicitation. This includes gathering and organizing relevant documentation and resources.", "dom": "Implementing Business Analysis"}, {"q": "Which of the following characteristics verifies that a requirement has been fulfilled?", "opts": ["Concise", "Testable", "Feasible", "Atomic"], "key": "B", "expl": "A requirement is considered wellverified when it is testable, meaning it can be tested to determine if it has been fulfilled.", "dom": "Stakeholder"}, {"q": "During the requirements analysis phase, the business analyst is expected to precisely specify requirements and designs. Which of the following tools would be most appropriate for this task, considering the audience and the purpose of the models?", "opts": ["Modelling Notations/Standards", "Solution Scope", "Requirements Architecture", "Business Capability Analysis"], "key": "A", "expl": "Modelling Notations/Standards are the correct answer because they provide a standardized method for representing the project's requirements and designs. This allows for clear communication among all stakeholders, regardless of their technical expertise. They are used to visualize, specify, construct, and document the artifacts of a system, and to illuminate business decisions.Option 1: Business Capability Analysis is a method for determining the business attributes a system is supposed to possess. This is not a tool for specifying requirements or designs.Option 2: Solution Scope refers to the boundaries of the solution, it does not allow for precise specification of requirements and designs.Option 3: Requirements Architecture is the structure of the system's requirements, but it does not allow for precise specification of requirements and designs.", "dom": "Techniques"}, {"q": "When initially assigned work, understanding the scope of elicitation is important in order to:", "opts": ["plan the business analysis approach", "discover the requirements.", "identify the stakeholders.", "review the project charter."], "key": "A", "expl": "Understanding the scope of elicitation is important for business analysts to plan the business analysis approach effectively. It's a crucial step in project initiation.", "dom": "Implementing Business Analysis"}, {"q": "What type of requirements describes the needs of those participating in or impacted by business analysis activities?", "opts": ["Solution", "Technical", "Stakeholder", "Business"], "key": "C", "expl": "Stakeholder requirements describe the needs and expectations of those who are participating in or impacted by business analysis activities.", "dom": "Requirements Analysis and Design Definition"}, {"q": "ABC Corporation is developing a new system to manage customer data. As a business analyst, you are assigned to define the specific details, rules, and constraints for each data element within the system. Which technique would you use?", "opts": ["Data Dictionary", "Backlog Management", "Benchmarking and Market Analysis", "Balanced Scorecard"], "key": "A", "expl": "In this scenario, the business analyst is tasked with defining the specific details, rules, and constraints for each data element within the system. This involves identifying the data elements, defining their attributes, and specifying the rules and constraints that apply to them. The Data Dictionary technique is specifically designed for this purpose. It provides a structured way to document and manage these details, making it the correct choice.Option 1: The Balanced Scorecard is a strategic planning and management system that organizations use to align business activities to the vision and strategy of the organization, improve internal and external communications, and monitor organization performance against strategic goals. It is not used for defining the specific details, rules, and constraints for each data element within a system.Option 3: Benchmarking and Market Analysis is a technique used to identify best practices, generate ideas for improvement, provide a basis for measuring performance, and establish functional requirements. It is not used for defining the specific details, rules, and constraints for each data element within a system.Option 4: Backlog Management is a method of tracking and prioritizing work items. It does not involve defining the specific details, rules, and constraints for each data element within a system.", "dom": "Techniques"}, {"q": "During the Plan Stakeholder Engagement process, an analyst is tasked with understanding the attitudes of stakeholders. How can this understanding contribute to the success of the project?", "opts": ["It allows the analyst to evaluate the effectiveness of the project management tools.", "It makes the stakeholder engagement process more complex and challenging.", "It allows the analyst to tailor communication strategies to effectively engage with each stakeholder.", "It enables the analyst to predict the geographic location of stakeholders for future projects."], "key": "C", "expl": "Understanding stakeholder attitudes is crucial in the Plan Stakeholder Engagement process because it allows the analyst to tailor communication strategies to effectively engage with each stakeholder. This understanding helps the analyst comprehend what may impact a stakeholder's actions and behaviours, which can be instrumental in managing stakeholder expectations and ensuring their support for the project. It also helps in identifying potential risks and issues that may arise, allowing for proactive management strategies.Option 2: Predicting the geographic location of stakeholders for future projects is not directly related to understanding stakeholder attitudes. While geographic location may affect stakeholder engagement strategies, it is not the primary reason for understanding stakeholder attitudes.Option 3: Understanding stakeholder attitudes does not make the stakeholder engagement process more complex. Instead, it simplifies the process by allowing for more effective communication and engagement strategies.Option 4: Evaluating the effectiveness of project management tools is not directly related to understanding stakeholder attitudes. While effective tools can aid in stakeholder engagement, they are not the primary reason for understanding stakeholder attitudes.", "dom": "Elicitation and Collaboration"}, {"q": "When do the participants start generating ideas during a collaborative game?", "opts": ["Closing step", "Exploration step", "Iteration step", "Opening step"], "key": "D", "expl": "Participants typically start generating ideas during the opening step of a collaborative game or brainstorming session. This step is where creativity and idea generation begin.", "dom": "Elicitation and Collaboration"}, {"q": "Linda, a BA, is evaluating multiple design options for an upcoming project. What will help her determine the best tradeoffs?", "opts": ["By understanding the cost to implement each solution component.", "By ignoring the dependencies between requirements.", "By disregarding costtobenefit ratios.", "By overlooking allocated resources."], "key": "A", "expl": "According to BABOK® v3, as costs and effort are understood for each solution component, business analysts assess each design option to ensure that it represents the most effective tradeoffs.The other options (A, B, and C) describe actions that are contrary to effective tradeoff analysis.BABOK v3 Chapter 7.6.4", "dom": "Requirements Analysis and Design Definition"}, {"q": "When validating requirements, assumptions are:", "opts": ["vital to support strategic decisions and goals.", "based and assessed on previous experience.", "defined so that associated risk can be managed.", "documented after conducting further analysis."], "key": "C", "expl": "When validating requirements, assumptions are defined so that associated risks can be managed. Understanding and documenting assumptions is essential for risk management in the business analysis process.", "dom": "Solution"}, {"q": "When can a change to requirements occur?", "opts": ["Only after the solution has been designed", "As soon as the testing process has begun", "Only after requirements have been approved", "At any time during the project lifecycle"], "key": "D", "expl": "Changes to requirements can occur at any time during the project lifecycle. It's essential to be flexible and responsive to changing needs and circumstances.", "dom": "Requirements Life Cycle Management"}, {"q": "You are a business analyst working on a new project. You have conducted a review meeting with stakeholders to discuss the potential solutions. According to BABOKÂ® v3, what is the primary purpose of this review meeting?", "opts": ["To assess quality and planning in the initial stages of the project", "To provide stakeholders with an opportunity to express feedback and gain consensus", "To individually communicate information to each stakeholder", "To present a highlevel overview of the project goals"], "key": "B", "expl": "ccording to BABOKÂ® v3, the primary purpose of reviews as a communication technique is to provide stakeholders with an opportunity to express feedback and gain consensus. It allows stakeholders to understand the potential solutions, express their views and concerns, and reach a common understanding or agreement.Option 1: While presenting a highlevel overview of the project goals can be part of the review meeting, it is not the primary purpose of the review as a communication technique.Option 2: Communicating information individually to each stakeholder can be a part of the communication process, but it is not the primary purpose of the review.Option 3: Assessing quality and planning in the initial stages of the project is important, but it is not the primary purpose of the review as a communication technique.", "dom": "Elicitation and Collaboration"}, {"q": "Your team has just completed a comprehensive business analysis for a major project. The report has been disseminated through the Information Management Approach and presented in formal documentation. However, during a followup meeting, it becomes clear that some stakeholders have not fully understood the content and implications of the report. Based on this scenario, when can the business analysis information be considered communicated?", "opts": ["Once it is presented in formal documentation.", "When it is reviewed and approved by all stakeholders.", "When the target stakeholders have reached an understanding of its content and implications.", "Immediately after it is disseminated through the Information Management Approach."], "key": "C", "expl": "The business analysis information is considered communicated when the target stakeholders have reached an understanding of its content and implications. This means that simply disseminating the information or presenting it in formal documentation is not enough. The stakeholders need to understand the information for it to be considered communicated. This is crucial to ensure that everyone is on the same page and that the project can move forward effectively.Option 1: Simply disseminating the information through the Information Management Approach does not ensure that the information has been understood by the target stakeholders.Option 2: Presenting the information in formal documentation is a necessary step, but it does not guarantee that the target stakeholders have understood the content and implications of the information.Option 3: Even if the information is reviewed and approved by all stakeholders, this does not necessarily mean that they have fully understood its content and implications.", "dom": "Elicitation and Collaboration"}, {"q": "What tool classifies stakeholders according to responsibility?", "opts": ["Personas", "Stakeholder Map", "Stakeholder List", "RACI Matrix"], "key": "D", "expl": "The RACI Matrix (Responsible, Accountable, Consulted, Informed) is a tool that classifies stakeholders according to their responsibility and involvement in a project or process.", "dom": "Stakeholder"}, {"q": "A business analyst is working on a project to develop a new software application. The project manager asks the analyst for an approximation of the cost, time, and effort required to complete the project. Which technique should the business analyst use?", "opts": ["Estimation", "Data Dictionary", "Backlog Management", "Benchmarking and Market Analysis"], "key": "A", "expl": "Estimation is the correct answer. Estimation is a technique used to approximate the most realistic cost, time, or effort required to complete a project. It involves predicting the most likely outcomes based on available data and information. This technique is crucial for effective project planning and management.Option 1: Backlog Management is a technique used to prioritize and manage pending work or 'backlog'. It is not specifically used for approximating cost, time, or effort required for a project.Option 2: Benchmarking and Market Analysis is a technique used to compare an organization's performance against other similar organizations or industry standards. It does not directly help in approximating cost, time, or effort required for a project.Option 3: Data Dictionary is a tool used to define and manage all the data resources of a project. While it is useful for data management, it does not directly help in approximating cost, time, or effort required for a project.", "dom": "Techniques"}, {"q": "During a review meeting, it's clear that not all stakeholders are on board with a solution. What's the recommended next step?", "opts": ["The business analyst records approval decisions", "The stakeholder roles and responsibilities are redesignated", "The associated risks are identified and managed accordingly", "The requirements and designs are checked for supportability within the constraints imposed by technology standards"], "key": "C", "expl": "BABOK® v3 suggests that complete agreement may not always be necessary for a successful change. However, if there is a lack of agreement, the associated risks need to be identified and managed accordingly. This means assessing the impact of the disagreement and taking steps to mitigate potential negative consequences.BABOK v3 Chapter 5.5.4", "dom": "Requirements Life Cycle Management"}, {"q": "You are a business analyst working on a project that involves significant changes to the existing system. The project manager has submitted a request for a change that will affect the project's scope. Which of the following is NOT a step you should take according to the Change Control Process in BABOKÂ® v3?", "opts": ["Documenting the proposed change and its potential impact", "Evaluating the impact of the proposed change on the project's cost and timeline", "Implementing the change without a formal approval process", "Assessing the risks of foregoing or delaying the change approval"], "key": "C", "expl": "According to BABOKÂ® v3, the Change Control Process does not involve implementing changes without a formal approval process. This is because all changes, especially those that affect the project's scope, must be thoroughly evaluated for their potential impact on the project's cost, timeline, and risks. Implementing changes without a formal approval process can lead to unforeseen consequences and risks.Option 1: Evaluating the impact of the proposed change on the project's cost and timeline is an essential part of the Change Control Process. This helps to ensure that the change is feasible and beneficial for the project.Option 2: Documenting the proposed change and its potential impact is a crucial step in the Change Control Process. This documentation provides a record of the change and aids in decisionmaking.Option 3: Assessing the risks of foregoing or delaying the change approval is a part of the Change Control Process. This assessment helps to determine whether the change should be implemented immediately or can be delayed.", "dom": "Requirements Life Cycle Management"}, {"q": "You are working as a Business Analyst in a software development company. There is a proposed change to an existing requirement. As part of your analysis, which of the following would you consider as part of your impact analysis?", "opts": ["Evaluation of the business analyst's performance", "Evaluation of the cost, benefit, schedule impact, and urgency of the change", "Analysis of the business' annual profit", "Review of the competitors in the market"], "key": "B", "expl": "Impact analysis, as part of the requirements analysis and design definition, involves understanding the potential consequences of a change. This includes evaluating the cost, benefit, schedule impact, and urgency of the change. It helps to understand the implications of implementing the change and aids in decision making.Option 1: Analysis of the business' annual profit is not directly related to the impact analysis of a specific change to requirements. While it may provide some context, it does not provide the detailed information necessary for an impact analysis.Option 2: Review of the competitors in the market is part of the strategic analysis, not the impact analysis of a specific change to requirements. It does not provide direct information about the potential impact of a change.Option 4: Evaluation of the business analyst's performance is not part of impact analysis. While the performance of a business analyst may affect the quality of the analysis, it does not directly impact the analysis of a specific change to requirements.", "dom": "Requirements Analysis and Design Definition"}, {"q": "A company, XYZ Corp, has recently implemented a new system for tracing its requirements. As a Business Analyst, you are tasked with analyzing the potential benefits of this new system. Which of the following is NOT a likely benefit that XYZ Corp would experience from this new system?", "opts": ["Lower costs for project implementation.", "More reliable discovery of inconsistencies and gaps in requirements.", "Increased transparency of the project's progress to stakeholders.", "Faster and simpler impact analysis when changes occur."], "key": "C", "expl": "Option 1 is the correct answer. While increased transparency of the project's progress to stakeholders is a potential benefit of many business analysis practices, it is not directly related to the tracing of requirements. Requirements tracing is primarily aimed at understanding the source of requirements and how they are transformed into solutions. It helps in impact analysis, identifying inconsistencies and gaps, and potentially lowering implementation costs by avoiding rework, but it does not necessarily increase transparency to stakeholders.Option 2: Option 2 is incorrect because faster and simpler impact analysis is a likely benefit of requirements tracing. By understanding the source and flow of requirements, it becomes easier to analyze the impact of changes to those requirements.Option 3: Option 3 is incorrect because more reliable discovery of inconsistencies and gaps in requirements is a likely benefit of requirements tracing. Tracing helps to ensure that all requirements are consistent with each other and that there are no gaps in the requirements that might lead to incomplete solutions.Option 4: Option 4 is incorrect because lower costs for project implementation is a likely benefit of requirements tracing. By avoiding rework and ensuring that all requirements are correctly implemented, the overall cost of project implementation can be reduced.", "dom": "Business Analysis Planning and Monitoring"}, {"q": "In the context of a project, the project manager has identified several risks during the execution phase. The team needs to manage and track these risks along with certain action items. Which technique would be most suitable in this scenario?", "opts": ["Backlog Management", "Document Analysis", "Item Tracking", "Benchmarking and Market Analysis"], "key": "C", "expl": "Item Tracking is the correct answer. In the context of project management, Item Tracking refers to the process of tracking and managing issues, risks, and action items during the execution of a project. It allows for realtime visibility into the status of these items, enabling the team to manage them effectively and mitigate any potential impact on the project.Option 1: Benchmarking and Market Analysis is incorrect. While it is an important technique for understanding market trends and comparing organizational performance against competitors, it does not directly involve the tracking and management of issues, risks, and action items during project execution.Option 2: Document Analysis is incorrect. While it is a useful technique for understanding and interpreting information contained in various documents, it does not directly involve the tracking and management of issues, risks, and action items during project execution.Option 3: Backlog Management is incorrect. While it is a key technique for managing the list of tasks or work to be done in a project, it does not directly involve the tracking and management of issues, risks, and action items during project execution.", "dom": "Business Analysis Planning and Monitoring"}, {"q": "In the context of a new mobile banking application project, your task as a business analyst is to ensure that the solution remains effective under certain conditions and possesses certain qualities. Which type of requirements would you primarily focus on in this scenario?", "opts": ["Transition requirements", "Stakeholder requirements", "Solution requirements", "Business requirements"], "key": "C", "expl": "Solution requirements describe the capabilities and qualities that a solution must have in order to meet the need and the value delivery that stakeholders expect. In this scenario, since the question focuses on the conditions under which the solution (mobile banking application) must remain effective and the qualities it must possess, the answer is 'Solution requirements'.Option 1: Business requirements describe the higherlevel needs of the organization as a whole, such as business objectives or the reasons why a project has been undertaken. They don't usually detail the specific conditions under which a solution must remain effective or the qualities that a solution must possess.Option 2: Stakeholder requirements are statements of the needs of a particular stakeholder or class of stakeholders. They reflect the stakeholders' understanding of the business requirements and their needs, expectations, and constraints. While these may influence the conditions and qualities of the solution, they are not the primary focus in this scenario.Option 4: Transition requirements describe capabilities that the solution must have in order to facilitate transition from the current state to the desired future state, such as data conversion or training requirements. These are not directly related to the conditions under which the solution must remain effective or the qualities that a solution must possess.", "dom": "Requirements Analysis and Design Definition"}, {"q": "Your team is working on a project to improve the efficiency of a company's internal processes. You have been assigned to analyze the potential value and recommend a solution. Which of the following techniques would you primarily use to define the requirements structure collaboratively?", "opts": ["Organizational Modelling", "Workshops", "Data Modelling", "Functional Decomposition"], "key": "B", "expl": "Workshops are often used as a technique to define the requirements structure collaboratively. They provide a forum for stakeholders to discuss, elaborate, and agree upon requirements. This collaborative approach helps ensure that the requirements are understood and agreed upon by all stakeholders, which is crucial for the success of the project.Option 1: Organizational Modelling is a technique used to understand the organizational context for the requirements. While it can support the understanding of requirements, it is not primarily used to define the requirements structure collaboratively.Option 2: Functional Decomposition is a technique used to break down complex processes or functional areas into smaller, manageable parts. While it can be used in conjunction with other techniques to define requirements, it is not primarily used to define the requirements structure collaboratively.Option 4: Data Modelling is a technique used to define the structure, relationships, and constraints of the data needed by the business processes. While it can support the understanding of requirements, it is not primarily used to define the requirements structure collaboratively.", "dom": "Elicitation and Collaboration"}];
const LETTERS = ["A","B","C","D"];
const $ = id => document.getElementById(id);
let submitted = false;

function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

$("total1").textContent = QUESTIONS.length;
$("examSub").textContent = QUESTIONS.length + " câu hỏi trắc nghiệm";

/* ---------- Bắt đầu ---------- */
function start(){
  const name = $("name").value.trim();
  if (!name){ $("nameErr").textContent = "Vui lòng nhập họ và tên trước khi làm bài."; $("name").focus(); return; }
  $("nameErr").textContent = "";
  $("who").textContent = name;
  $("start").classList.add("hidden");
  $("quiz").classList.remove("hidden");
  $("dock").classList.remove("hidden");
  build();
  updateProgress();
  window.scrollTo(0,0);
}
$("startBtn").addEventListener("click", start);
$("name").addEventListener("keydown", e => { if (e.key === "Enter") start(); });

/* ---------- Dựng câu hỏi ---------- */
function build(){
  const list = $("list");
  list.textContent = "";
  QUESTIONS.forEach((q, i) => {
    const box = el("article", "q"); box.id = "q" + i;
    const h = el("h2"); h.append(el("span", null, "Câu " + (i+1) + "/" + QUESTIONS.length));
    box.append(h, el("p", "text", q.q));
    const opts = el("div", "opts");
    opts.setAttribute("role", "radiogroup");
    q.opts.forEach((t, k) => {
      const lab = el("label", "opt");
      const inp = document.createElement("input");
      inp.type = "radio"; inp.name = "q" + i; inp.value = LETTERS[k];
      inp.addEventListener("change", updateProgress);
      lab.append(inp, el("span", "k", LETTERS[k] + "."), el("span", null, t));
      opts.append(lab);
    });
    box.append(opts);
    list.append(box);
  });
}

function answerOf(i){
  const c = document.querySelector('input[name="q' + i + '"]:checked');
  return c ? c.value : null;
}
function updateProgress(){
  if (submitted) return;
  let n = 0;
  QUESTIONS.forEach((_, i) => { if (answerOf(i)) n++; });
  $("prog").textContent = "Đã trả lời " + n + "/" + QUESTIONS.length;
}

/* ---------- Giải thích: tách phần chính và phần "Option N:" ---------- */
function splitExplain(txt){
  const parts = txt.split(/\s*Option \d+:\s*/);
  return { main: parts[0].trim(), extra: parts.slice(1).map(s => s.trim()).filter(Boolean) };
}

/* ---------- Nộp bài ---------- */
function submit(){
  if (submitted) return;
  submitted = true;
  let right = 0, wrong = 0, skipped = 0;

  QUESTIONS.forEach((q, i) => {
    const box = $("q" + i);
    const picked = answerOf(i);
    const keyIdx = LETTERS.indexOf(q.key);
    box.classList.add("locked");

    let state;
    if (!picked){ state = "skip"; skipped++; }
    else if (picked === q.key){ state = "ok"; right++; }
    else { state = "bad"; wrong++; }
    box.classList.add("r-" + state);

    box.querySelector("h2").append(el("span", "badge",
      state === "ok" ? "✓ Đúng" : state === "bad" ? "✗ Sai" : "Chưa trả lời"));

    box.querySelectorAll(".opt").forEach((lab, k) => {
      const inp = lab.querySelector("input");
      inp.disabled = true;
      if (k === keyIdx){ lab.classList.add("correct"); lab.append(el("span", "tag", "✓ Đáp án đúng")); }
      else if (LETTERS[k] === picked){ lab.classList.add("wrong"); lab.append(el("span", "tag", "✗ Bạn chọn")); }
    });

    const ex = el("div", "explain");
    ex.append(el("p", "ans", "Đáp án đúng: " + q.key + ". " + q.opts[keyIdx]));
    const s = splitExplain(q.expl);
    if (s.main) ex.append(el("p", null, s.main));
    if (s.extra.length){
      const ul = el("ul");
      s.extra.forEach(t => ul.append(el("li", null, t)));
      ex.append(ul);
    }
    if (q.dom) ex.append(el("div", "domain", "Lĩnh vực: " + q.dom));
    box.append(ex);
  });

  const total = QUESTIONS.length;
  const pct = right / total * 100;
  const pctTxt = (Math.round(pct * 10) / 10).toString().replace(".", ",") + "%";
  const res = $("result");
  res.textContent = "";
  res.append(el("h2", null, "Kết quả của " + $("who").textContent));
  const stats = el("div", "stats");
  [[right + "/" + total, "Số câu đúng"], [pctTxt, "Tỷ lệ câu đúng"], [String(wrong), "Câu sai"], [String(skipped), "Chưa trả lời"]]
    .forEach(([b, s]) => { const d = el("div", "stat"); d.append(el("b", null, b), el("span", null, s)); stats.append(d); });
  const bar = el("div", "bar"); const fill = document.createElement("i"); fill.style.width = pct + "%"; bar.append(fill);
  res.append(stats, bar);
  const again = el("button", "ghost", "Làm lại bài thi"); again.type = "button"; again.style.marginTop = "16px";
  again.addEventListener("click", () => location.reload());
  res.append(again);
  res.classList.remove("hidden");

  $("whoNote").textContent = "Đã nộp bài";
  $("prog").textContent = "Đúng " + right + "/" + total + " (" + pctTxt + ")";
  $("submitBtn").textContent = "Lên đầu trang";
  $("submitBtn").onclick = () => window.scrollTo(0,0);
  window.scrollTo(0,0);
  res.focus({preventScroll:true});
}
$("submitBtn").addEventListener("click", submit);
</script>
</body>
</html>
