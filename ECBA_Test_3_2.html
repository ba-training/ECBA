<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECBA Test 3.2</title>
<style>
:root{
  color-scheme: light dark;
  --bg:#f3f6fa; --surface:#ffffff; --ink:#1a2230; --muted:#5b6678; --line:#d9e0ea;
  --brand:#1d4f91; --brand-ink:#ffffff; --brand-soft:#e4edf8;
  --ok:#17703f; --ok-soft:#e1f4e8; --bad:#a82f26; --bad-soft:#fbe6e3; --skip:#7a5a00; --skip-soft:#fbf0d2;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#10151d; --surface:#1a212c; --ink:#e8edf4; --muted:#9aa6b8; --line:#2c3646;
    --brand:#7fb0ee; --brand-ink:#0d1a2b; --brand-soft:#203248;
    --ok:#6fd49a; --ok-soft:#173526; --bad:#ff9a90; --bad-soft:#3d1f1c; --skip:#f0cf72; --skip-soft:#38300f;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 120px}
header.top{background:var(--brand);color:var(--brand-ink);padding:28px 16px;text-align:center}
header.top h1{margin:0;font-size:clamp(1.4rem,4vw,2rem);line-height:1.2;letter-spacing:.2px}
header.top p{margin:6px 0 0;opacity:.85;font-size:.95rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;margin-top:20px}
.hidden{display:none!important}
label.field{display:block;font-weight:600;margin-bottom:8px}
input[type=text]{width:100%;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input[type=text]:focus-visible,button:focus-visible,.opt:has(input:focus-visible){outline:3px solid var(--brand);outline-offset:2px}
.err{color:var(--bad);margin:8px 0 0;min-height:1.4em;font-size:.92rem}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:12px 22px;background:var(--brand);color:var(--brand-ink);cursor:pointer}
button.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand)}
button:hover{filter:brightness(1.08)}
.who{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:.95rem;margin-top:20px}
.who strong{color:var(--ink)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;margin-top:16px;border-left-width:6px}
.q h2{margin:0 0 4px;font-size:.95rem;color:var(--muted);font-weight:600;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.q .text{margin:0 0 14px;font-size:1.05rem;font-weight:600}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--bg)}
.opt:hover{border-color:var(--brand)}
.opt input{margin-top:5px;accent-color:var(--brand)}
.opt .k{font-weight:700;min-width:1.3em}
.opt:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.locked .opt{cursor:default}
.locked .opt:hover{border-color:var(--line)}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt .tag{margin-left:auto;font-size:.85rem;font-weight:700;white-space:nowrap;padding-left:8px}
.opt.correct .tag{color:var(--ok)} .opt.wrong .tag{color:var(--bad)}
.q.r-ok{border-left-color:var(--ok)} .q.r-bad{border-left-color:var(--bad)} .q.r-skip{border-left-color:var(--skip)}
.badge{font-size:.85rem;font-weight:700;padding:2px 10px;border-radius:99px}
.r-ok .badge{background:var(--ok-soft);color:var(--ok)}
.r-bad .badge{background:var(--bad-soft);color:var(--bad)}
.r-skip .badge{background:var(--skip-soft);color:var(--skip)}
.explain{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.explain .ans{margin:0 0 8px;font-weight:700}
.explain p{margin:0 0 8px}
.explain ul{margin:6px 0 0;padding-left:20px;color:var(--muted)}
.explain li{margin-bottom:6px}
.domain{font-size:.85rem;color:var(--muted);margin-top:8px}
.result{border-width:2px;border-color:var(--brand)}
.result h2{margin:0 0 12px;font-size:1.25rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px}
.stat b{display:block;font-size:1.7rem;line-height:1.2}
.stat span{color:var(--muted);font-size:.9rem}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px}
.dock .in{max-width:820px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.dock .prog{color:var(--muted);font-size:.95rem}
.note{color:var(--muted);font-size:.92rem;margin:10px 0 0}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<header class="top">
  <h1 id="examTitle">ECBA Test 3.2</h1>
  <p id="examSub"></p>
</header>

<main class="wrap">
  <section id="start" class="card">
    <label class="field" for="name">Nhập họ và tên của bạn để bắt đầu làm bài</label>
    <input id="name" type="text" autocomplete="name" placeholder="Ví dụ: Nguyễn Văn A" maxlength="80">
    <p class="err" id="nameErr" role="alert"></p>
    <button id="startBtn" type="button">Bắt đầu làm bài</button>
    <p class="note">Bài gồm <span id="total1"></span> câu trắc nghiệm. Bạn có thể nộp bài bất cứ lúc nào; câu chưa trả lời sẽ tính là sai.</p>
  </section>

  <section id="quiz" class="hidden">
    <div class="who"><span>Thí sinh: <strong id="who"></strong></span><span id="whoNote"></span></div>
    <div id="result" class="card result hidden" tabindex="-1"></div>
    <form id="form" onsubmit="return false"><div id="list"></div></form>
  </section>
</main>

<div class="dock hidden" id="dock">
  <div class="in">
    <span class="prog" id="prog"></span>
    <button id="submitBtn" type="button">Nộp bài</button>
  </div>
</div>

<script>
const QUESTIONS = [{"q": "A company is considering a new project to develop a software solution that will streamline its internal processes. The business analyst has been asked to analyze the potential value and recommend a solution. Which of the following steps should the business analyst prioritize?", "opts": ["Identify the stakeholders and their needs", "Evaluate the solution options", "Implement the solution without further analysis", "Assess the organizational readiness for change"], "key": "B", "expl": "The business analyst's main task in this scenario is to analyze the potential value and recommend a solution. This involves evaluating the solution options to determine which one best meets the organization's needs and offers the best value. This is the primary step before moving forward with any solution.Option 1: While identifying the stakeholders and their needs is an important part of the business analysis process, it is not the immediate step in analyzing the potential value and recommending a solution. The stakeholders' needs should have been identified in the earlier stages of the business analysis process.Option 3: Assessing the organizational readiness for change is important, but it is not the immediate step in analyzing the potential value and recommending a solution. This is typically done after a solution has been recommended.Option 4: Implementing the solution without further analysis is not advisable. The business analyst's task is to first analyze the potential value and recommend a solution. Implementing a solution without proper analysis could lead to problems down the line.", "dom": "Requirements Analysis and Design Definition"}, {"q": "Why should a business analyst (BA) perform a cultural assessment when analyzing the current state of an enterprise?", "opts": ["To understand the scope of decision making at different levels of the enterprise", "To document the communication channels, reporting structures, and relationships in the enterprise", "To determine whether stakeholders understand the rationale for the current state of the enterprise", "To identify the formal relationships between people working in the enterprise"], "key": "C", "expl": "Performing a cultural assessment allows a business analyst to understand the beliefs, values, and behaviors that influence how people within the enterprise perceive and respond to change. This understanding helps determine whether stakeholders truly grasp the rationale behind the current state of the enterprise, which is essential for ensuring alignment and readiness for future changes.", "dom": "Context"}, {"q": "What tool is used by a business analyst (BA) for quality control when verifying requirements and designs?", "opts": ["Estimation", "Checklists", "Interviews", "Benchmarking"], "key": "B", "expl": "Checklists are a tool used by business analysts for quality control when verifying requirements and designs. They help ensure that requirements and designs meet predefined criteria.", "dom": "Understanding Business Analysis"}, {"q": "Which of the following is the integrated output that correctly reflects captured information agreed to by business analysts (BAs) and otherstakeholders?", "opts": ["Concept model", "Activity plan", "Business analysis information", "Confirmed elicitation results"], "key": "D", "expl": "Confirmed elicitation results are the integrated output that correctly reflects captured information agreed to by business analysts and other stakeholders.", "dom": "Techniques"}, {"q": "As a business analyst, Jane is conducting a meeting with a group of stakeholders to identify a specific business requirement. During the meeting, Jane is using her body language, facial expressions, and gestures to communicate different ideas and concepts. What is the purpose of Jane using this form of communication?", "opts": ["To express business analysis information, ideas, concepts, facts, and opinions", "To accurately understand information that is communicated verbally", "To present information and ideas using text, symbols, models, and sketches", "To convey messages through body movement, posture, facial expressions, gestures, and eye contact"], "key": "D", "expl": "Nonverbal communication is a powerful tool in conveying messages and emotions. It includes body movement, posture, facial expressions, gestures, and eye contact. In this scenario, Jane is using nonverbal communication to effectively express her ideas and concepts to the stakeholders. This approach allows her to emphasize certain points and convey her message more effectively.Option 1: While presenting information using text, symbols, models, and sketches is a form of communication, it does not involve nonverbal cues such as body language or facial expressions.Option 2: Understanding verbal information accurately is crucial in communication, but it is not the primary purpose of using nonverbal communication.Option 3: Although expressing business analysis information, ideas, concepts, facts, and opinions is a part of communication, it is not specifically tied to nonverbal communication.", "dom": "Elicitation and Collaboration"}, {"q": "What is the input status of requirements used by business analysts (BAs) for undertaking requirement verification activities?", "opts": ["Stated and Unconfirmed", "Specified and Modeled", "Validated and Prioritized", "Maintained and Reusable"], "key": "B", "expl": "Before verifying requirements, Business Analysts (BAs) ensure they are clearly documented and structured for analysis.Specified → Welldefined, written, and detailed.Modeled → Represented using diagrams, prototypes, or structured formats for clarity.Other incorrect answers: A (Stated and Unconfirmed) → Raw, unstructured requirements; not ready for verification. B (Maintained and Reusable) → Applies to finalized requirements stored for reuse. D (Validated and Prioritized) → Validation happens after verification.", "dom": "Value"}, {"q": "In a recent project, a new software solution has been proposed to improve operational efficiency. As a business analyst, you are tasked with analyzing the potential value and recommending this solution. Who would be primarily responsible for reviewing and agreeing upon this recommendation?", "opts": ["Key Stakeholders", "Domain Subject Matter Experts", "Project Manager", "Business Analysts"], "key": "A", "expl": "The correct answer is Key Stakeholders. According to the BABOK v3, under the 'Requirements Analysis and Design Definition' knowledge area and task 'Analyze Potential Value and Recommend Solution', it is the key stakeholders who are primarily responsible for reviewing and agreeing upon the recommendation of a solution. They have the authority to make decisions and validate the value proposition of the solution.Option 1: Business Analysts are responsible for analyzing and recommending the solution, but the final decision and agreement are made by the key stakeholders.Option 2: Domain Subject Matter Experts provide valuable inputs and insights, but they do not have the authority to make final decisions.Option 4: The Project Manager oversees the project execution, but the decisionmaking authority for agreeing upon a solution lies with the key stakeholders.", "dom": "Business Analysis and the BA Professional"}, {"q": "Which techniques should be applied to prioritize requirements?", "opts": ["Document Analysis and Vendor Assessment", "Decision Modelling and Estimation", "Interface Analysis and Interviews", "Risk Analysis and Management"], "key": "B", "expl": "Decision modeling and estimation techniques can be applied to prioritize requirements effectively by evaluating their impact, feasibility, and importance.", "dom": "Solution"}, {"q": "As a business analyst at XYZ Corp, you are tasked with analyzing potential value and recommending a solution for a new project. The project involves implementing a new software system to streamline operations. Which of the following is the MOST important factor to consider?", "opts": ["The cost of the new software system", "The potential value the new software system could bring to the organization", "The vendor of the new software system", "The technical specifications of the new software system"], "key": "B", "expl": "The most important factor to consider when analyzing potential value and recommending a solution is the potential value that the solution could bring to the organization. The cost, technical specifications, and the vendor of the software system are certainly important factors to consider, but they are secondary to the potential value. The business analyst's main goal is to ensure that the solution brings the maximum value to the organization.Option 1: While cost is an important factor to consider, it is not the most important. The primary focus should be on the value that the solution can bring to the organization.Option 2: Technical specifications are important to ensure that the solution is feasible and can be implemented successfully. However, the primary focus should be on the value that the solution can bring to the organization.Option 4: The vendor of the software system is an important consideration, but it is not as important as the potential value that the solution can bring to the organization.", "dom": "Requirements Analysis and Design Definition"}, {"q": "Which approach aligns to approval of requirements at the end of a phase?", "opts": ["Modelling", "Prioritization", "Predictive", "Adaptive"], "key": "C", "expl": "Approving requirements at the end of a phase is a characteristic of the predictive approach, where requirements are thoroughly defined and approved before proceeding to the next phase.", "dom": "Requirements Life Cycle Management"}, {"q": "As a business analyst, you are working on a project to develop a new software application. While analyzing the requirements architecture, you come across the term 'view'. What does 'view' refer to in this context?", "opts": ["A collection of viewpoints that is standard across an industry, sector, or organization.", "The structure of all of the requirements of a change.", "The actual requirements and designs for a particular solution from a chosen viewpoint.", "A set of conventions that define how requirements will be represented, organized, and related."], "key": "C", "expl": "In the context of requirements architecture, a 'view' refers to the actual requirements and designs for a particular solution from a chosen viewpoint. It is a representation of the system from the perspective of a related set of concerns. It is essentially a partial representation of the system, and different views may cover overlapping elements of the system.Option 1: This option describes a 'viewpoint', not a 'view'. A viewpoint is a set of conventions for constructing, interpreting and using views to frame a specific set of concerns.Option 3: This option is incorrect as it also describes a 'viewpoint', not a 'view'. A collection of viewpoints can be standard across an industry, sector, or organization, but it does not define a 'view'.Option 4: This option is incorrect as it describes the structure of requirements, not a 'view'. The structure of all of the requirements of a change is part of the requirements architecture, but it does not define a 'view'.", "dom": "Requirements Analysis and Design Definition"}, {"q": "You are a business analyst working on a new software development project. The project manager has asked you to prioritize the requirements. Which of the following methods would NOT be appropriate for this task?", "opts": ["MoSCoW method", "Decision Analysis", "Fibonacci Sequence", "Pairwise Comparison"], "key": "C", "expl": "The Fibonacci Sequence is a series of numbers in which each number is the sum of the two preceding ones, often associated with financial calculations or software development estimations, but not directly used in prioritizing requirements. Prioritization of requirements is a crucial step in business analysis to determine which requirements will provide the most value and should be implemented first. Methods such as MoSCoW, Pairwise Comparison, and Decision Analysis are commonly used for this purpose.Option 1: The MoSCoW method is a popular technique used in business analysis and project management for prioritizing requirements. It divides requirements into four categories: Must have, Should have, Could have, and Won't have.Option 2: Pairwise Comparison is a method used in decision making, and in this case, for prioritizing requirements. Each requirement is compared against each other requirement to establish which requirement is more important.Option 3: Decision Analysis is a method used to evaluate and prioritize alternatives based on values and uncertainties. It can be used to prioritize requirements by evaluating the potential impact and value of each requirement.", "dom": "Techniques"}, {"q": "What does the Impact Resolution element involve in the context of assessing requirements changes?", "opts": ["Authorizing certain stakeholders to approve, deny, or defer the proposed change", "Tracking the performance of team members involved in change implementation", "Assessing the financial consequences of a proposed change", "Developing a business strategy for implementing changes"], "key": "A", "expl": "According to the \"5.4.4 Elements\" section of BABOK® v3 , Impact Resolution involves various stakeholders (including the business analyst) who may be authorized to approve, deny, or defer the proposed change. Developing a business strategy for implementing changes, assessing the financial consequences of a proposed change, or tracking the performance of team members involved in change implementation are not specifically described as parts of the Impact Resolution process.BABOK v3 Chapter 5.4.4", "dom": "Change"}, {"q": "You are a business analyst working for a software development company. The company is working on a project that involves a complex but uniform structure of requirements. Which of the following tools would be most appropriate to model these requirements?", "opts": ["Matrix", "Workflow Diagram", "Use Case Diagram", "Entity Relationship Diagram"], "key": "A", "expl": "A matrix is the most suitable tool to model a complex but uniform structure of requirements. Matrices allow for the representation of relationships between different elements in a clear and structured manner. This can be especially useful when dealing with a large number of requirements that have a uniform structure, as it allows for easy visualization and understanding of the relationships between these requirements.Option 1: A use case diagram is a type of behavioral diagram in the Unified Modeling Language (UML) that represents a user's interaction with the system. It may not be the best tool to model a complex but uniform structure of requirements.Option 3: A workflow diagram represents the flow of processes, showing the steps as boxes of various kinds, and their order by connecting them with arrows. This diagram is more suitable for demonstrating the sequence of activities rather than modeling a complex but uniform structure of requirements.Option 4: An Entity Relationship Diagram (ERD) represents the relationship between entities in a database. It is not typically used to model a complex but uniform structure of requirements.", "dom": "Techniques"}, {"q": "You are a business analyst working on a project to develop a new software application. The project team has identified a number of potential solutions. Your task is to analyze the potential value of these solutions and make a recommendation. Which of the following would be the most appropriate approach to accomplish this task?", "opts": ["Selecting the solution that is most popular among the stakeholders.", "Choosing the solution that is easiest and quickest to implement.", "Discussing the solutions with the project team and making a decision based on their opinions.", "Evaluating each solution against the business objectives and requirements, considering the potential benefits, costs, risks, and opportunities associated with each solution."], "key": "D", "expl": "The most appropriate approach to analyze the potential value of a solution and make a recommendation is to evaluate each solution against the business objectives and requirements. This includes considering the potential benefits, costs, risks, and opportunities associated with each solution. This approach ensures that the chosen solution will provide the maximum value to the business and meet the business needs.Option 1: While the opinions of the project team can provide valuable insights, they should not be the sole basis for the decision. The potential value of the solutions should be analyzed objectively based on the business objectives and requirements.Option 3: Choosing the solution that is easiest and quickest to implement may not necessarily provide the maximum value to the business. The potential benefits, costs, risks, and opportunities associated with each solution should be considered.Option 4: The popularity of a solution among the stakeholders does not necessarily mean that it will provide the maximum value to the business. The potential value of the solutions should be analyzed objectively based on the business objectives and requirements.", "dom": "Techniques"}];
const LETTERS = ["A","B","C","D"];
const $ = id => document.getElementById(id);
let submitted = false;

function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

$("total1").textContent = QUESTIONS.length;
$("examSub").textContent = QUESTIONS.length + " câu hỏi trắc nghiệm";

/* ---------- Bắt đầu ---------- */
function start(){
  const name = $("name").value.trim();
  if (!name){ $("nameErr").textContent = "Vui lòng nhập họ và tên trước khi làm bài."; $("name").focus(); return; }
  $("nameErr").textContent = "";
  $("who").textContent = name;
  $("start").classList.add("hidden");
  $("quiz").classList.remove("hidden");
  $("dock").classList.remove("hidden");
  build();
  updateProgress();
  window.scrollTo(0,0);
}
$("startBtn").addEventListener("click", start);
$("name").addEventListener("keydown", e => { if (e.key === "Enter") start(); });

/* ---------- Dựng câu hỏi ---------- */
function build(){
  const list = $("list");
  list.textContent = "";
  QUESTIONS.forEach((q, i) => {
    const box = el("article", "q"); box.id = "q" + i;
    const h = el("h2"); h.append(el("span", null, "Câu " + (i+1) + "/" + QUESTIONS.length));
    box.append(h, el("p", "text", q.q));
    const opts = el("div", "opts");
    opts.setAttribute("role", "radiogroup");
    q.opts.forEach((t, k) => {
      const lab = el("label", "opt");
      const inp = document.createElement("input");
      inp.type = "radio"; inp.name = "q" + i; inp.value = LETTERS[k];
      inp.addEventListener("change", updateProgress);
      lab.append(inp, el("span", "k", LETTERS[k] + "."), el("span", null, t));
      opts.append(lab);
    });
    box.append(opts);
    list.append(box);
  });
}

function answerOf(i){
  const c = document.querySelector('input[name="q' + i + '"]:checked');
  return c ? c.value : null;
}
function updateProgress(){
  if (submitted) return;
  let n = 0;
  QUESTIONS.forEach((_, i) => { if (answerOf(i)) n++; });
  $("prog").textContent = "Đã trả lời " + n + "/" + QUESTIONS.length;
}

/* ---------- Giải thích: tách phần chính và phần "Option N:" ---------- */
function splitExplain(txt){
  const parts = txt.split(/\s*Option \d+:\s*/);
  return { main: parts[0].trim(), extra: parts.slice(1).map(s => s.trim()).filter(Boolean) };
}

/* ---------- Nộp bài ---------- */
function submit(){
  if (submitted) return;
  submitted = true;
  let right = 0, wrong = 0, skipped = 0;

  QUESTIONS.forEach((q, i) => {
    const box = $("q" + i);
    const picked = answerOf(i);
    const keyIdx = LETTERS.indexOf(q.key);
    box.classList.add("locked");

    let state;
    if (!picked){ state = "skip"; skipped++; }
    else if (picked === q.key){ state = "ok"; right++; }
    else { state = "bad"; wrong++; }
    box.classList.add("r-" + state);

    box.querySelector("h2").append(el("span", "badge",
      state === "ok" ? "✓ Đúng" : state === "bad" ? "✗ Sai" : "Chưa trả lời"));

    box.querySelectorAll(".opt").forEach((lab, k) => {
      const inp = lab.querySelector("input");
      inp.disabled = true;
      if (k === keyIdx){ lab.classList.add("correct"); lab.append(el("span", "tag", "✓ Đáp án đúng")); }
      else if (LETTERS[k] === picked){ lab.classList.add("wrong"); lab.append(el("span", "tag", "✗ Bạn chọn")); }
    });

    const ex = el("div", "explain");
    ex.append(el("p", "ans", "Đáp án đúng: " + q.key + ". " + q.opts[keyIdx]));
    const s = splitExplain(q.expl);
    if (s.main) ex.append(el("p", null, s.main));
    if (s.extra.length){
      const ul = el("ul");
      s.extra.forEach(t => ul.append(el("li", null, t)));
      ex.append(ul);
    }
    if (q.dom) ex.append(el("div", "domain", "Lĩnh vực: " + q.dom));
    box.append(ex);
  });

  const total = QUESTIONS.length;
  const pct = right / total * 100;
  const pctTxt = (Math.round(pct * 10) / 10).toString().replace(".", ",") + "%";
  const res = $("result");
  res.textContent = "";
  res.append(el("h2", null, "Kết quả của " + $("who").textContent));
  const stats = el("div", "stats");
  [[right + "/" + total, "Số câu đúng"], [pctTxt, "Tỷ lệ câu đúng"], [String(wrong), "Câu sai"], [String(skipped), "Chưa trả lời"]]
    .forEach(([b, s]) => { const d = el("div", "stat"); d.append(el("b", null, b), el("span", null, s)); stats.append(d); });
  const bar = el("div", "bar"); const fill = document.createElement("i"); fill.style.width = pct + "%"; bar.append(fill);
  res.append(stats, bar);
  const again = el("button", "ghost", "Làm lại bài thi"); again.type = "button"; again.style.marginTop = "16px";
  again.addEventListener("click", () => location.reload());
  res.append(again);
  res.classList.remove("hidden");

  $("whoNote").textContent = "Đã nộp bài";
  $("prog").textContent = "Đúng " + right + "/" + total + " (" + pctTxt + ")";
  $("submitBtn").textContent = "Lên đầu trang";
  $("submitBtn").onclick = () => window.scrollTo(0,0);
  window.scrollTo(0,0);
  res.focus({preventScroll:true});
}
$("submitBtn").addEventListener("click", submit);
</script>
</body>
</html>
